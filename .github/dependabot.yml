version: 2

updates:
  # GitHub Actions. Dependabot rewrites the pinned SHA and updates the trailing
  # version comment, which is the only sustainable way to keep SHA pinning from
  # rotting into permanently stale actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - "type/chore"
      - "area/ci"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Milestone 0 development tooling.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - "type/chore"
      - "area/ci"
    groups:
      dev-tooling:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Go modules (Milestone 2) and npm (Milestone 2, dashboard) are deliberately
  # NOT registered yet.
  #
  # These were originally listed here on the assumption that Dependabot ignores
  # an ecosystem whose manifest does not exist. It does not — it runs, fails to
  # find go.mod and package.json, and reports an error on every schedule. Two
  # permanently red jobs on a repository with no Go or JavaScript in it is how
  # people learn to ignore red jobs.
  #
  # Add the blocks below when the first go.mod and package.json land:
  #
  #   - package-ecosystem: gomod
  #     directory: "/"
  #     schedule: {interval: weekly, day: monday, time: "06:00"}
  #     commit-message: {prefix: "build", include: scope}
  #     labels: ["type/chore", "area/core"]
  #
  #   - package-ecosystem: npm
  #     directory: "/dashboard"
  #     schedule: {interval: weekly, day: monday, time: "06:00"}
  #     commit-message: {prefix: "build", include: scope}
  #     labels: ["type/chore", "area/dashboard"]
