name: CI

# Runs on every pull request, including from forks. Fork pull requests execute
# untrusted code, so this workflow is built on the assumption that the code it
# checks out is hostile:
#
#   - `pull_request`, never `pull_request_target` — forks get the base repo's
#     permissions but none of its secrets
#   - read-only token at the top level, elevated per job only where needed
#   - every third-party action pinned to a full commit SHA
#   - no self-hosted runners
#
# See docs/security/ci-security.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check encoding, line endings, whitespace and file size
        run: python3 scripts/check_hygiene.py

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Lint Markdown
        run: pymarkdown --config .pymarkdown.json scan .

      - name: Check internal links
        run: python3 scripts/check_links.py

      - name: Build documentation site
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build --strict
          else
            echo "No mkdocs.yml yet; nothing to build."
          fi

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Lint YAML
        run: |
          paths=""
          for p in .github schemas app-store mkdocs.yml; do
            [ -e "$p" ] && paths="$paths $p"
          done
          # shellcheck disable=SC2086
          yamllint --strict $paths

      - name: Validate the OpenAPI contract
        run: |
          if [ -f api/openapi.yaml ]; then
            openapi-spec-validator api/openapi.yaml
          else
            echo "No OpenAPI contract yet."
          fi

      - name: Validate JSON Schemas and fixtures
        run: |
          if [ -f scripts/validate_contracts.py ]; then
            python3 scripts/validate_contracts.py
          else
            echo "No contracts to validate yet."
          fi

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install zizmor
        run: pip install "zizmor==1.29.0"

      # Catches unpinned actions, template-expression injection into run: blocks,
      # over-broad permissions and dangerous triggers. This job is what stops the
      # hardening rules above from quietly decaying.
      - name: Analyse workflow security
        run: zizmor --persona=regular --format=plain .github/workflows/

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret removed in the head commit is still a leaked
          # secret if it exists anywhere in the branch.
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks *binary*, not gitleaks/gitleaks-action.
      #
      # The action is closed-source, commercially licensed, and by its own
      # documentation contacts keygen.sh for licence validation on every run.
      # Granting a third party execution rights in CI to check our own hygiene is
      # the trade docs/security/ci-security.md argues against, and phoning home
      # from a security job makes it worse.
      #
      # The binary is MIT, pinned by version, and verified by checksum before it
      # is allowed to run — a stronger guarantee than pinning an action SHA gives,
      # since we verify the artifact itself rather than the recipe that fetches it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history for secrets
        run: gitleaks git --no-banner --redact --verbose .
