name: Security

# Supply-chain and dependency checks. Split from ci.yml because these run on a
# schedule as well as on pull requests — a dependency that was clean on Monday can
# have a published advisory by Friday without anyone touching the repository.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays, 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    # Only meaningful on a pull request; there is no base to diff against otherwise.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # Homebase ships under Apache-2.0. Strong copyleft in a dependency is a
          # licensing decision, not a routine upgrade — it needs a human.
          deny-licenses: GPL-3.0, AGPL-3.0, SSPL-1.0

  pinned-actions:
    name: pinned-actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A mutable tag is a promise that someone else controls what runs in our CI.
      # zizmor flags this too; this check states the rule in terms anyone can read
      # in a failure message.
      - name: Every action must be pinned to a commit SHA
        run: |
          set -euo pipefail
          if grep -rnE '^\s*(-\s*)?uses:\s*[^#]*@(v[0-9]|main|master)' \
               .github/workflows/ ; then
            echo
            echo "Actions above are pinned to a mutable ref."
            echo "Pin to the full 40-character commit SHA, with the version in a"
            echo "trailing comment: uses: owner/repo@<sha> # v1.2.3"
            exit 1
          fi
          echo "All actions are pinned to commit SHAs."

  scorecard:
    name: scorecard
    # Scorecard needs repository-level state; it is meaningless on a fork PR and
    # cannot get the token it needs there.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard.sarif
