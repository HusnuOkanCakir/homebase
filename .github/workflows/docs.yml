name: Docs

# Publishes the documentation site to GitHub Pages.
#
# On since Milestone 6, which is when the audience arrived. Until then the docs
# were readable in the repository and that was enough — GitHub renders mermaid
# natively, so the architecture diagrams worked as they were. What a published
# site adds is full-text search, a navigation sidebar and a clean URL, and those
# matter once there are people who will not clone the repository. A person who
# has just installed a server appliance from a USB stick cannot be told to browse
# to docs/user-guide/backup.md on GitHub.
#
# Kept from when this was disabled, because the misdiagnosis is instructive:
#
#   It was switched off during a GitHub incident -- "Pages - Deployment Lag",
#   2026-08-06, since resolved -- in which deployments were created and then sat
#   in `deployment_queued` until the action timed out. The failure looked like a
#   repository misconfiguration and was investigated as one, through a fresh
#   commit and a delete-and-recreate of the Pages site, before githubstatus.com
#   listed the incident. The build had succeeded and the artifact had uploaded
#   every time.
#
#   When every input to a step is correct and it still fails, check whether the
#   service is up before rebuilding your own side of it.
#
# Note that `mkdocs build --strict` still runs on every pull request, in ci.yml's
# `docs` job. Validation and publication are separate concerns: the strict build
# is what catches an orphaned page or a broken nav reference, and it earns its
# keep whether or not anything is published. This workflow only publishes what
# that job has already proven builds.
#
# Manual runs are deliberately left available, so a deployment can be retried
# without editing this file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment in progress: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
