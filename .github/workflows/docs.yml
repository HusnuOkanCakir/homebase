name: Docs

# Publishes the documentation site to GitHub Pages.
#
# DISABLED until Milestone 6. Re-enable by uncommenting the `push` trigger below.
#
# Why it is off:
#
# The docs are readable in the repository today. GitHub renders mermaid natively,
# so the architecture diagrams work as they are, and 28 of 29 pages read fine
# without a site. What a published site adds — full-text search, a navigation
# sidebar, a clean URL — matters when there is an audience that will not clone the
# repository. That audience arrives at Milestone 6, with the first installable
# release: a person who has just installed a server appliance cannot be told to
# browse to docs/user-guide/backup.md on GitHub.
#
# It is also off because it does not currently work. Deployments are created and
# then sit in `deployment_queued` until the action times out, on every attempt,
# across a fresh commit and a delete-and-recreate of the Pages site. The build
# succeeds and the artifact uploads; GitHub's Pages backend never picks it up.
# `pages.status` stays null with zero builds ever recorded. That is outside this
# repository's control, and leaving a workflow permanently red is how people learn
# to ignore red workflows.
#
# Note that `mkdocs build --strict` still runs on every pull request, in ci.yml's
# `docs` job. Validation and publication are separate concerns: the strict build
# is what catches an orphaned page or a broken nav reference, and it keeps earning
# its keep whether or not anything is published.
#
# To re-enable at Milestone 6:
#   1. Uncomment the `push` trigger
#   2. Confirm Pages is enabled — scripts/setup-branch-protection.sh does this
#   3. Run manually first via workflow_dispatch and confirm the site serves
#
# Manual runs are deliberately left available, so the deployment can be retried
# without editing this file.

on:
  # Re-enable at Milestone 6. See above.
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment in progress: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: pip install -r requirements-dev.txt

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
