name: Go

# Build, vet and test the Go services.
#
# Hardened the same way as ci.yml: pull_request rather than pull_request_target,
# read-only token, every action pinned to a commit SHA, no self-hosted runners.
# See docs/security/ci-security.md.

# No path filters.
#
# A required check that never reports blocks the merge — GitHub does not treat
# it as satisfied, which an earlier version of docs/development/repository.md
# wrongly claimed. With filters, any pull request not touching these paths
# (a documentation change, for instance) waited forever for a check that was
# never going to run.
#
# The standard alternative is a companion workflow on the inverse paths that
# reports the same check name and immediately succeeds. That works, and it means
# two workflows can produce a check called `dashboard`, one of which tests
# nothing. For a build this size — under two minutes — running it on every pull
# request is simpler and harder to get wrong.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `stable`, not go-version-file. The `go` directive in go.mod is a
      # language-version floor for contributors, not a toolchain pin — reading it
      # here made CI build with Go 1.23.12, which govulncheck correctly reported
      # as carrying 19 standard-library vulnerabilities. Building with the current
      # release is how those get fixed; pinning an old one and suppressing the
      # scanner is how they get shipped.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - name: Toolchain
        run: go version

      - name: Formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            echo
            echo "Run: gofmt -w ./cmd ./internal"
            exit 1
          fi
          echo "All files are formatted."

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

      # hostd runs as root and its dependency tree is code that runs as root.
      # ADR-0002 commits to keeping it close to the standard library; this is
      # what makes that commitment observable rather than aspirational.
      - name: No third-party dependencies in the privileged service
        run: |
          # `.Standard` is Go's own answer to "is this the standard library",
          # which matters because the stdlib vendors golang.org/x/* internally —
          # grepping import paths for a dot reports those as third-party and is
          # wrong.
          deps=$(go list -deps -f '{{if not .Standard}}{{.ImportPath}}{{end}}' ./cmd/hostd \
                 | grep -v '^github.com/HusnuOkanCakir/homebase' || true)
          if [ -n "$deps" ]; then
            echo "hostd has acquired non-stdlib dependencies:"
            echo "$deps"
            echo
            echo "hostd runs as root. Every dependency here is code running as root."
            echo "Adding one is a security review, not a build change -- see ADR-0002."
            exit 1
          fi
          echo "hostd depends only on the Go standard library."

      # The registry is the source of truth for docs, contract tests and the
      # Stage 2 capability list. If it cannot be exported, all three break.
      - name: Operation registry is exportable
        run: |
          go run ./cmd/hostd --describe > /tmp/operations.json
          python3 -m json.tool /tmp/operations.json > /dev/null
          echo "Operations declared:"
          python3 -c "
          import json
          ops = json.load(open('/tmp/operations.json'))['operations']
          for op in ops:
              print(f\"  {op['name']:<26} risk={op['risk']:<8} confirm={op['confirmation']}\")
          "

      # A confirmation requirement that can be downgraded during a refactor is
      # not a confirmation requirement, and nothing else in the build would
      # notice: the code compiles, the tests pass, and a destructive operation
      # simply stops asking.
      - name: Destructive operations still require what they should
        run: python3 scripts/check_operations.py /tmp/operations.json

      - name: Vulnerability scan
        run: |
          # Pinned, and the pin has to move with the toolchain.
          #
          # v1.1.4 bundles an x/tools too old to parse Go 1.27, and panics with
          # `unexpected expr: *ast.KeyValueExpr` while building SSA. It does not
          # fail every time — govulncheck analyses packages concurrently, so
          # whether it reaches the construct it cannot parse varies between
          # runs. That intermittency is worse than a hard failure: it reads as a
          # flaky job, and a scan people learn to re-run is a scan that is not
          # protecting anything.
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./... || {
            echo
            echo "govulncheck reported a problem. If it is a false positive, say so"
            echo "in the pull request rather than suppressing it silently."
            exit 1
          }

  # Packaging is where the privilege split stops being unit files in a
  # repository and becomes something the kernel enforces: the socket mode, the
  # service account, the directory ownership. It gets its own job because those
  # properties are checked at build time and are worth failing on their own.
  packages:
    name: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build the dashboard
        run: |
          cd dashboard
          npm ci
          npm run build

      # dpkg-deb and fakeroot only — no debhelper. `make packages` does the same
      # thing here as on a laptop, which is the point.
      - name: Build packages
        run: make packages VERSION=0.0.0~ci

      # A package that installs cleanly on a fresh machine and then fails on the
      # second run leaves a half-configured system, which is a state nothing has
      # code for. The VM suite covers the full lifecycle; this covers the part
      # that needs no VM.
      - name: Install, reinstall and purge
        run: |
          set -euo pipefail
          # apt rather than dpkg, and this is not cosmetic: homebase-core
          # depends on avahi-daemon, which a runner does not have. dpkg does not
          # resolve dependencies — it unpacks, fails to configure, and leaves
          # exactly the half-installed state this job exists to rule out. apt is
          # also what a user runs.
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/*.deb
          echo "--- reinstalling the same version ---"
          sudo apt-get install -y --reinstall ./dist/*.deb
          echo "--- the accounts and directories the boundary depends on ---"
          getent group homebase
          getent passwd homebase
          stat -c '%a %U %G  %n' /etc/homebase /var/lib/homebase /srv/homebase
          test "$(stat -c '%U' /var/lib/homebase)" = homebase
          test "$(stat -c '%U' /etc/homebase)" = root
          echo "--- user data must survive purge ---"
          sudo touch /srv/homebase/user-file
          sudo apt-get remove -y --purge homebase-dashboard homebase-core homebase-hostd
          # sudo, because /srv/homebase is 0750 homebase:homebase and this user
          # cannot traverse it. Without it the check reports missing data on a
          # machine where the data is perfectly fine — a false alarm about
          # exactly the thing that must never produce one.
          sudo test -f /srv/homebase/user-file \
            || { echo "purge removed user data"; exit 1; }
          sudo test -f /var/lib/homebase/homebase.db \
            || { echo "purge removed the database"; exit 1; }
          echo "user data and the database survived purge"
