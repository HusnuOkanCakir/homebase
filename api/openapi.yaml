openapi: 3.1.0

info:
  title: Homebase Core API
  version: 1.0.0-draft
  summary: The only supported interface to a Homebase server.
  description: |
    Every endpoint below is implemented and served. CI checks this specification against
    the routes `core` actually serves, in both directions, so a path documented here and
    missing from the server fails the build. The recovery tools — diagnostic bundle, service
    repair, factory reset — arrive later in Milestone 8 and are not described yet.

    The dashboard, `homebasectl` and — from Stage 2 — the local AI operator are all clients
    of this API. Nothing bypasses it, and nothing that uses it holds privilege of its own:
    every privileged action is performed by `hostd` behind a fixed set of typed operations.

    Two conventions are worth knowing before reading further.

    **Every mutating endpoint returns `202` with a job**, never a finished result — even for
    operations that are usually instant. A client that has to know which operations are fast
    is a client that breaks the first time a "fast" one is not.

    **Error `code` is the contract; `message` is not.** Clients switch on `code`, which never
    changes meaning once shipped. Rewording a `message` is a compatible change.

    See the [API conventions](https://github.com/HusnuOkanCakir/homebase/blob/main/docs/architecture/api-conventions.md).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Homebase
    url: https://github.com/HusnuOkanCakir/homebase

servers:
  - url: https://homebase.local/api/v1
    description: A Homebase server on the local network

tags:
  - name: system
    description: System information and machine-level operations
  - name: jobs
    description: Long-running operations
  - name: apps
    description: Installing and running applications
  - name: shares
    description: Folders published onto the local network over SMB
  - name: storage
    description: Disks, and the locations Homebase manages on them
  - name: backup
    description: Backing up this server, and putting it back
  - name: auth
    description: Sessions, and getting back in when the password is gone
  - name: network
    description: How the server is connected, and whether it is
  - name: update
    description: What version this server runs, and where it updates from
  - name: events
    description: Structured events and the audit trail
  - name: assistant
    description: A language model running on this machine, if it has one
  - name: accounts
    description: The people who use this server
  - name: files
    description: Browsing, fetching and changing files, over HTTPS rather than SMB

security:
  - sessionCookie: []
  - bearerToken: []

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness and readiness
      description: |
        Unauthenticated, so that a machine that cannot authenticate anyone can still be
        diagnosed. It reveals whether the service is up and whether `hostd` is reachable —
        deliberately nothing else.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Running but not ready, typically because `hostd` is unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system:
    get:
      tags: [system]
      summary: System information and current resource usage
      description: |
        Read live from `hostd` on every request. Nothing here is cached or remembered —
        a remembered disk-usage figure is a wrong disk-usage figure, and the Stage 2
        operator must never reason about the machine from stale values.

        **Answers every signed-in account, and says less to some.** With `system.read` this is
        the whole machine. Without it — an account given a login only to fetch a file — it is
        the machine's name and version and nothing else: no disks, no memory, no temperature,
        no uptime.

        That is not a courtesy. The dashboard polls this every five seconds to draw its own
        header, so requiring `system.read` meant an account without it got a refusal every five
        seconds and an error across every screen it *was* entitled to use.
      operationId: getSystem
      responses:
        "200":
          description: Current system state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/System"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/Unavailable"

  /system/history:
    get:
      tags: [system]
      summary: How hot this machine has been, and how hard its fan has worked
      description: |
        Requires `system.read`. A reading every five minutes, kept in a plain CSV at
        `/var/log/homebase/thermal.csv`.

        **The file is the record, not a table in the database.** The same reasoning as
        backups being plain files: a record about a machine that can only be read by
        software running on that machine is worth much less than one somebody can open in a
        spreadsheet or grep from an ssh session. It also means this endpoint keeps working
        while the database is being restored, which is one of the times somebody most wants
        to know what the machine was doing.

        One reading tells you almost nothing — 58 °C is fine, or it is the start of an
        afternoon that ends in thermal shutdown. Every question worth asking is a
        comparison, which is why this exists at all.
      operationId: getSystemHistory
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 7 }
          description: How far back to look.
        - name: points
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 500 }
          description: |
            Most readings to return. The series is **thinned, not truncated** — keeping the
            most recent N would answer "the last six hours" to somebody who asked about the
            last month.
      responses:
        "200":
          description: The readings, and what they add up to
          content:
            application/json:
              schema:
                type: object
                required: [samples, recording]
                properties:
                  samples:
                    type: array
                    items:
                      type: object
                      properties:
                        time: { type: string, format: date-time }
                        celsius: { type: [integer, "null"] }
                        fan_rpm: { type: [integer, "null"] }
                        fan_percent: { type: [integer, "null"] }
                        state: { type: string }
                        fan_control: { type: string }
                        load: { type: number }
                  hottest_celsius: { type: [integer, "null"] }
                  coolest_celsius: { type: [integer, "null"] }
                  average_celsius: { type: [integer, "null"] }
                  loudest_rpm: { type: [integer, "null"] }
                  quietest_rpm: { type: [integer, "null"] }
                  since:
                    type: string
                    description: The oldest reading returned, so a caller can say what
                      period the summary covers rather than implying it covers everything.
                  recording:
                    type: boolean
                    description: |
                      Whether readings are being taken at all. An empty history on a newly
                      installed machine and an empty history because the recorder is broken
                      look identical, and only one needs anybody to do something.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /system/reboot:
    post:
      tags: [system]
      summary: Reboot the server
      description: |
        Requires `system.manage`. Returns a job that will not complete in the usual sense —
        the connection drops when the machine goes down. Clients should treat loss of
        connectivity after a `202` as expected rather than as a failure.
      operationId: rebootSystem
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PowerRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An exclusive job is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          description: |
            `confirm` did not name this server. Deliberately not a 400: the request was
            well formed and was refused for naming a different machine.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/shutdown:
    post:
      tags: [system]
      summary: Switch the server off
      description: |
        Requires `system.manage`. The same contract as `/system/reboot` in every respect
        the API can express — a job that will not complete in the usual sense, and a
        confirmation naming this machine.

        What differs is not in the response. Nothing brings the machine back: a client
        calling this is the last thing that will be able to tell somebody how to switch it
        on again, and should have said so before it was called rather than after.
      operationId: shutdownSystem
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PowerRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: An exclusive job is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "428":
          description: |
            `confirm` did not name this server.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/name:
    post:
      tags: [system]
      summary: Change what this server calls itself
      description: |
        Requires `system.manage`.

        Not a job, and the only mutating endpoint that is not. The convention exists because
        a client that has to know which operations are fast breaks the first time a "fast"
        one is not — but renaming is three file writes and a syscall, cannot be interrupted
        usefully, and the first thing a client does afterwards is read the name back.

        Nothing is destroyed. The cost of getting it wrong is a server somebody has to look
        up the address of again, which is why it does not ask twice. It does change the
        answer `POST /system/reboot` demands as its confirmation.
      operationId: renameSystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 63
                  pattern: "^[a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?$"
                  description: |
                    Letters, digits and hyphens. Not a full domain name: this is what the
                    machine calls itself, and it ends up in `/etc/hostname`.
                  example: living-room
      responses:
        "200":
          description: The server's name, before and after
          content:
            application/json:
              schema:
                type: object
                required: [previous, name, message]
                properties:
                  previous:
                    type: string
                  name:
                    type: string
                  message:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: That cannot be a machine's name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /assistant:
    get:
      tags: [assistant]
      summary: Whether this server has a local model, and what it is
      description: |
        Requires `assistant.use`.

        Answers on every machine, including the great majority that have no model at all:
        `available: false` with a `reason` written for a person. A caller can then say what
        is missing rather than hiding a feature silently — the dashboard uses this to decide
        whether to show the tab.

        **Nothing here reaches the internet.** The model is a file on this machine, served by
        a process on loopback, with no account and no upstream. That is the entire reason a
        small model on modest hardware is worth having over a better one elsewhere.

        Off unless core was started with `--assistant-url`.
      operationId: getAssistant
      responses:
        "200":
          description: What the assistant is, or why there is not one
          content:
            application/json:
              schema:
                type: object
                required: [available, max_turns, max_chars]
                properties:
                  available:
                    type: boolean
                    description: Whether a question asked right now would be answered.
                  model:
                    type: string
                    description: The model being served, named for reading.
                    example: Qwen3.8-4B-Q4_K_M
                  reason:
                    type: string
                    description: |
                      Why it is unavailable, in a sentence meant for a person. Distinguishes
                      "no key yet" from "cannot read the key" — those have different fixes.
                  max_turns:
                    type: integer
                    description: |
                      Most messages a conversation may carry. The model's context is small,
                      and a limit stated up front is better than one that silently drops the
                      earliest turns — which reads as the assistant developing amnesia.
                  max_chars:
                    type: integer
                    description: Longest single message accepted.
                  models:
                    type: array
                    description: |
                      Every model this account may select, in offer order.

                      **Filtered by permission before it is written, not after.** A model
                      somebody may not use is not one they should learn exists from a
                      greyed-out entry, so it is absent rather than disabled.
                    items:
                      type: object
                      required: [id, label, available, unrestricted]
                      properties:
                        id:
                          type: string
                          description: What to send as `model`. Stable; the label is not.
                          example: local
                        label:
                          type: string
                        name:
                          type: string
                          description: What the server underneath reports.
                          example: Qwen3.8-4B-Q4_K_M
                        available:
                          type: boolean
                        reason:
                          type: string
                          description: |
                            Why it is unavailable. For a contained model, "it is not
                            running" is the ordinary state rather than a fault.
                        unrestricted:
                          type: boolean
                          description: |
                            A model whose refusal behaviour was removed by a third party.

                            Requires `assistant.unrestricted`, which is **not** granted by
                            setting up the machine, **not** granted by being an
                            administrator, and cannot be granted through this API at all —
                            an endpoint that grants it is an endpoint a stolen session can
                            call. It is added with `homebasectl assistant unrestricted`,
                            run on the server.

                            Homebase can use such a model and has no way to start one.
                            There is no operation here that unlocks its volume or launches
                            it, deliberately: that would be a privileged operation whose
                            purpose is to make it easier to reach.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /assistant/chat:
    post:
      tags: [assistant]
      summary: Ask the local model something
      description: |
        Requires `assistant.use`.

        Returns **Server-Sent Events**, not JSON. This hardware writes six or seven tokens a
        second, so a full answer takes minutes; a client that waited for a complete body
        would be indistinguishable from one talking to a hung server.

        Events:

        - `token` — `{"text": "..."}`, a piece of the answer. Concatenate in order.
        - `done` — `{"reason": "stop" | "length"}`. `length` means the answer hit the token
          ceiling and stops mid-thought, which a client should say rather than leave a
          sentence that simply ends.
        - `failed` — the stream broke part-way. Text already received is still valid.

        Lines beginning `:` are comments and must be ignored.

        **One question at a time.** The model server has a single slot. A second request is
        refused with `409` rather than queued, because a caller waiting behind somebody
        else's two-minute answer cannot tell that from a server that has stopped responding.

        **Nothing is stored.** The transcript is sent by the client on each turn and kept by
        nobody once the response is written.

        Refusals arrive as ordinary JSON, since they happen before streaming starts.
      operationId: postAssistantChat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  description: |
                    The conversation so far, oldest first, ending with the new question.
                    Bounded by `max_turns` from `GET /assistant`.
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                model:
                  type: string
                  description: |
                    Which offered model answers. Omit for the primary one.

                    Selecting an unrestricted model is always deliberate: a request naming
                    no model never reaches one, and naming one without holding
                    `assistant.unrestricted` is refused with `assistant.not_permitted`
                    whether or not it was offered.
                  example: local
                think:
                  type: boolean
                  default: false
                  description: |
                    Let the model reason before answering. Measured at roughly four times the
                    time-to-answer on this class of hardware, so it stays something asked for
                    rather than a default.
      responses:
        "200":
          description: The answer, streamed as it is written
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                : connected

                event: token
                data: {"text":"A home "}

                event: token
                data: {"text":"server is "}

                event: done
                data: {"reason":"stop"}
        "400":
          description: Nothing to ask, a message too long, or a conversation past the limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The assistant is already answering a question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: No model is configured, or it is not responding
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /accounts:
    get:
      tags: [accounts]
      summary: Everybody on this server
      description: |
        Requires `accounts.manage`.

        Returns roles, not permission arrays. The point of naming roles is that nobody has to
        read fourteen strings to answer "what can my father do".

        `has_signed_in` separates an invitation nobody has accepted from an account somebody
        is using — the question an administrator actually has a week later.
      operationId: listAccounts
      responses:
        "200":
          description: The household
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

    post:
      tags: [accounts]
      summary: Add somebody to this server
      description: |
        Requires `accounts.manage`.

        **An administrator hands over a code, never a password.** The account is created with
        a password that cannot be used — random bytes, hashed, discarded unread — and the
        response carries a one-time joining code. The person exchanges it for a password only
        they know, through `POST /auth/recover`. There is no endpoint that sets somebody
        else's password and there should never be one.

        The code is shown once. It is stored the way a password is, so nothing — including
        this server — can produce it again; `POST /accounts/{id}/joining-code` issues a
        replacement.

        The name becomes their file-sharing login as well (`hbshare-<name>`), which is why it
        is restricted to lower-case letters, numbers and hyphens. A name Linux accepts and
        SMB does not is a name that works in the dashboard and fails at the file server with
        an authentication box that never explains itself.

        Returns the account rather than a job — a documented exception to the 202 convention,
        alongside `POST /system/name`. It is one transaction, nothing can be usefully
        interrupted, and the first thing a caller does is read the list back.
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              additionalProperties: false
              properties:
                username:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{0,30}[a-z0-9]$"
                  example: father
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: The account, and the joining code — once
          content:
            application/json:
              schema:
                type: object
                required: [id, username, role, joining_code, message]
                properties:
                  id: { type: string }
                  username: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
                  joining_code:
                    type: string
                    description: Shown once. Not recoverable.
                  message: { type: string }
        "400":
          description: The name cannot be used, or the role is not one of the three
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Somebody already has that name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /accounts/{account_id}/role:
    post:
      tags: [accounts]
      summary: Change what somebody may do
      description: |
        Requires `accounts.manage`.

        Takes effect on that person's next request — permissions are read from the database
        on every request, so nobody is signed out and nothing is cached.

        `assistant.unrestricted` survives a role change. It is granted by hand at the machine,
        deliberately outside every role, and a role change that silently revoked it would be a
        mystery with no error message attached.

        Refused with `accounts.last_administrator` if it would leave the server with nobody
        able to administer it.
      operationId: setAccountRole
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: The account's new role
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  username: { type: string }
                  role: { $ref: "#/components/schemas/Role" }
        "400": { description: Not one of the three roles, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: The last administrator, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /accounts/{account_id}/remove:
    post:
      tags: [accounts]
      summary: Remove somebody from this server
      description: |
        Requires `accounts.manage`, and a confirmation naming the person.

        **Their files are kept.** Removing an account and deleting somebody's photographs are
        different intentions, and collapsing them into one button is how a decade of pictures
        disappears behind a word like "Remove" — the same rule that applies to uninstalling an
        application and to unsharing a folder.

        Their sessions end immediately.

        The confirmation names the person rather than their identifier, unlike applications and
        backups: somebody removing their father knows his name and has never seen
        `usr_b5075ca5…`.
      operationId: removeAccount
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              additionalProperties: false
              properties:
                confirm:
                  type: string
                  description: The person's username, exactly.
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: string }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: The last administrator, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "428": { $ref: "#/components/responses/ConfirmationRequired" }

  /accounts/{account_id}/joining-code:
    post:
      tags: [accounts]
      summary: Issue a fresh sign-in code for somebody
      description: |
        Requires `accounts.manage`.

        For the person who lost their joining code before using it, or who has forgotten their
        password and cannot reach their own recovery code. Replaces any earlier code; shown
        once.

        This is not a way to learn somebody's password. It is a way to let them choose a new
        one, and it is recorded as `auth.recovery_code_reissued` — the same event the recovery
        screen writes, because it is the same act.
      operationId: reissueJoiningCode
      parameters:
        - name: account_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The code — once
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  joining_code: { type: string }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such account, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /jobs:
    get:
      tags: [jobs]
      summary: List jobs
      operationId: listJobs
      parameters:
        - name: state
          in: query
          description: Filter by state.
          schema:
            $ref: "#/components/schemas/JobState"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of jobs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
                  total:
                    type: integer
                    minimum: 0
                  next_cursor:
                    type: [string, "null"]
        "401":
          $ref: "#/components/responses/Unauthorized"

  /jobs/{job_id}:
    get:
      tags: [jobs]
      summary: Get a job
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^job_[0-9A-HJKMNP-TV-Z]{26}$"
      responses:
        "200":
          description: The job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{job_id}/cancel:
    post:
      tags: [jobs]
      summary: Cancel a job
      description: |
        Only jobs reporting `cancellable: true` may be cancelled. Cancellation is a request,
        not a guarantee — the job moves to `cancelling` and may still finish.
      operationId: cancelJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            pattern: "^job_[0-9A-HJKMNP-TV-Z]{26}$"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The job is not cancellable, or has already finished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /apps:
    get:
      tags: [apps]
      summary: List applications
      description: |
        Every application this server can run, with its current state. Requires `apps.read`.

        The list is the set of manifests installed on the machine — see
        [ADR-0012](https://github.com/HusnuOkanCakir/homebase/blob/main/docs/decisions/0012-hostd-owns-the-catalogue.md).
        There is no endpoint that adds to it, because adding an application is a package
        change rather than a runtime one.

        `docker_available: false` does not empty the list: a machine whose container runtime
        is down still knows what it can install, and reporting nothing would look identical to
        a machine with no applications.
      operationId: listApps
      responses:
        "200":
          description: The applications this server knows about
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total, docker_available]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Application"
                  total:
                    type: integer
                  docker_available:
                    type: boolean
                    description: |
                      Whether the container runtime could be reached. When false, every
                      application reports `not_installed` because its real state is unknown.
                  unavailable:
                    type: object
                    description: |
                      Manifests that failed to load, mapped to why. Reported rather than
                      hidden: an application that is silently absent is harder to diagnose
                      than one listed with a reason.
                    additionalProperties:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /apps/{app_id}:
    get:
      tags: [apps]
      summary: Get one application
      operationId: getApp
      parameters:
        - $ref: "#/components/parameters/AppID"
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppNotFound"

  /apps/{app_id}/logs:
    get:
      tags: [apps]
      summary: Recent output from an application
      description: |
        The application's own log output, as text. Requires `apps.read`.

        Returned as one string rather than parsed into lines: an application's log format is
        the application's business, and pretending to understand it would make Homebase wrong
        about every application that disagrees.
      operationId: getAppLogs
      parameters:
        - $ref: "#/components/parameters/AppID"
        - name: lines
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        "200":
          description: The application's recent output
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, lines, logs]
                properties:
                  id:
                    type: string
                  lines:
                    type: integer
                  logs:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppNotFound"

  /apps/{app_id}/install:
    post:
      tags: [apps]
      summary: Install an application
      description: |
        Requires `apps.manage`. Returns a job: installing means downloading an image, which on
        a home connection can take minutes.

        **This endpoint takes no parameters.** The container is built by `hostd` from the
        manifest; there is no way for a client to influence the image, the mounts, the ports
        or the environment. A request carrying such fields is rejected with `400` rather than
        accepted and ignored — a client sending `{"image": …}` believes it chose, and quietly
        installing something else is the worst of the three possible answers.
      operationId: installApp
      parameters:
        - $ref: "#/components/parameters/AppID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          description: The request carried settings this endpoint does not accept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppNotFound"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /apps/{app_id}/start:
    post:
      tags: [apps]
      summary: Start an application
      description: Requires `apps.manage`. Takes no parameters.
      operationId: startApp
      parameters:
        - $ref: "#/components/parameters/AppID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          description: The request carried settings this endpoint does not accept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppNotFound"

  /apps/{app_id}/stop:
    post:
      tags: [apps]
      summary: Stop an application
      description: |
        Requires `apps.manage` and a confirmation naming the application. Stopping takes a
        service away from whoever is using it, who may be somebody else in the house.
      operationId: stopApp
      parameters:
        - $ref: "#/components/parameters/AppID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppConfirmation"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppNotFound"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"

  /apps/{app_id}/restart:
    post:
      tags: [apps]
      summary: Restart an application
      description: Requires `apps.manage` and a confirmation naming the application.
      operationId: restartApp
      parameters:
        - $ref: "#/components/parameters/AppID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppConfirmation"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppNotFound"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"

  /apps/{app_id}/uninstall:
    post:
      tags: [apps]
      summary: Remove an application, keeping its data
      description: |
        Requires `apps.manage` and a confirmation naming the application.

        **The application's data is left on disk.** Uninstalling is how a user frees space or
        stops using something, and someone who wants their files gone has a different
        intention — `POST /apps/{app_id}/data/remove`. Reinstalling afterwards finds the data
        where it was.
      operationId: uninstallApp
      parameters:
        - $ref: "#/components/parameters/AppID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppConfirmation"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppNotFound"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"

  /apps/{app_id}/data/remove:
    post:
      tags: [apps]
      summary: Delete an application's data irreversibly
      description: |
        Requires `apps.manage`. **There is no undo and no backup taken first.**

        `confirm` must be the application's own id, typed rather than clicked: the
        confirmation for an irreversible deletion has to be something a user cannot do by
        reflex. The same check is made again by `hostd`, because a confirmation enforced in
        one place is a confirmation one refactor away from being enforced nowhere.
      operationId: removeAppData
      parameters:
        - $ref: "#/components/parameters/AppID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppConfirmation"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppNotFound"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"

  /storage/disks:
    get:
      tags: [storage]
      summary: List the disks attached to this server
      description: |
        Every block device worth showing a person, with what is on it. Requires `storage.read`.

        `system: true` marks the disk holding the running system. Homebase will not erase it,
        whatever is asked.
      operationId: listDisks
      responses:
        "200":
          description: The disks attached to this server
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Disk"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /storage/locations:
    get:
      tags: [storage]
      summary: List the storage locations Homebase manages
      description: |
        Requires `storage.read`.

        `connected` and `mounted` are reported separately on purpose: a disk that is plugged
        in but failed to mount is a different problem from one that is not plugged in, and
        conflating them tells the user to do the wrong thing.
      operationId: listLocations
      responses:
        "200":
          description: The managed locations
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/StorageLocation"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

    post:
      tags: [storage]
      summary: Start managing a disk
      description: |
        Requires `storage.modify`. Mounts the disk and keeps mounting it at every boot.

        **The disk is named by filesystem UUID, never by device path.** `/dev/sdb` becomes
        `/dev/sdc` when something else is plugged in first, so an API accepting a device path
        would be inviting a client to act on whichever disk holds that name today. See
        [ADR-0013](https://github.com/HusnuOkanCakir/homebase/blob/main/docs/decisions/0013-storage-identity-and-mounting.md).

        A volume with no UUID cannot be managed. Some FAT and exFAT volumes are affected, and
        the only remedy is to erase and prepare them.
      operationId: addLocation
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [uuid, id]
              properties:
                uuid:
                  type: string
                  description: The filesystem's UUID, from `GET /storage/disks`.
                id:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{0,30}[a-z0-9]$"
                  description: |
                    What this location is called on this machine. Becomes a directory name and
                    part of a systemd unit name.
                name:
                  type: string
                  description: What the user calls it. Defaults to the disk's label.
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          description: A missing or unusable field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /storage/locations/{location_id}/remove:
    post:
      tags: [storage]
      summary: Stop managing a disk
      description: |
        Requires `storage.modify` and a confirmation naming the location.

        **Nothing on the disk is changed.** The mount unit is removed and the disk is
        unmounted; every file on it stays exactly where it was.
      operationId: removeLocation
      parameters:
        - $ref: "#/components/parameters/LocationID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedConfirmation"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/LocationNotFound"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"

  /storage/locations/{location_id}/mount:
    post:
      tags: [storage]
      summary: Mount a location that is connected but not mounted
      description: Requires `storage.modify`. Takes no parameters.
      operationId: mountLocation
      parameters:
        - $ref: "#/components/parameters/LocationID"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          description: The request carried settings this endpoint does not accept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/LocationNotFound"

  /storage/locations/{location_id}/unmount:
    post:
      tags: [storage]
      summary: Unmount a location so the disk can be unplugged safely
      description: |
        Requires `storage.modify` and a confirmation naming the location. Applications using
        the disk must be stopped first; otherwise the unmount fails rather than forcing.
      operationId: unmountLocation
      parameters:
        - $ref: "#/components/parameters/LocationID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedConfirmation"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/LocationNotFound"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"

  /storage/format:
    post:
      tags: [storage]
      summary: Erase a disk and prepare it for use
      description: |
        Requires `storage.modify`. **Everything on the disk is permanently deleted, there is
        no undo, and no backup is taken first.**

        This is the only operation in Homebase that can destroy data Homebase never created —
        somebody's photographs, put on the disk before they had Homebase. `confirm` must
        repeat the disk's UUID, or its device path where it has no filesystem and therefore no
        UUID. It is checked here and again by `hostd`.

        Refused outright, whatever is confirmed: the disk holding the running system, any
        volume currently mounted, and any volume Homebase could not read. That last one
        matters — unreadable and blank are different answers, and only one of them is safe to
        act on.

        Homebase never selects a disk on the user's behalf, including when there is only one
        candidate.
      operationId: formatDisk
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                uuid:
                  type: string
                  description: The filesystem to erase. Preferred where the disk has one.
                device:
                  type: string
                  description: |
                    The device to erase, for a disk with no filesystem and therefore no UUID.
                    Resolved by `hostd` against a volume it discovered itself.
                label:
                  type: string
                  maxLength: 16
                  description: What to call the new filesystem.
                confirm:
                  type: string
                  description: The `uuid`, or the `device` where there is no UUID.
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          description: A missing or unusable field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"

  /apps/{app_id}/storage:
    get:
      tags: [storage, apps]
      summary: Where an application keeps its files
      description: |
        Each storage location the application declares, and what is behind it. Requires
        `apps.read`.

        `ready: false` at the top level means the application cannot start: one of its
        locations needs a disk chosen, or the disk it was given is not connected.
      operationId: getAppStorage
      parameters:
        - $ref: "#/components/parameters/AppID"
      responses:
        "200":
          description: The application's storage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStorage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppNotFound"

    post:
      tags: [storage, apps]
      summary: Choose which disk an application keeps its files on
      description: |
        Requires `apps.manage`.

        Takes effect the next time the application starts. **Nothing already written is
        moved**, and nothing is deleted — data on the previous location stays where it is.

        Only `user-selected` storage can be assigned. Storage Homebase places itself holds the
        application's own configuration, and putting that on a removable disk would mean the
        application cannot start without it — including the configuration recording which disk
        it wants.
      operationId: assignAppStorage
      parameters:
        - $ref: "#/components/parameters/AppID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storage_id, location]
              properties:
                storage_id:
                  type: string
                  description: Which of the application's declared locations this is.
                location:
                  type: string
                  description: A managed storage location's id.
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          description: A missing field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/AppNotFound"

  /backups:
    get:
      tags: [backup]
      summary: List the backups on a disk
      description: |
        Requires `backup.read`. Newest first.

        A backup with `complete: false` has no readable manifest — it was interrupted. It is
        listed rather than hidden, because a folder that looks like a backup and is not is
        exactly what nobody must rely on.
      operationId: listBackups
      parameters:
        - $ref: "#/components/parameters/BackupLocation"
      responses:
        "200":
          description: The backups on that disk
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total, location]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/BackupSummary"
                  total:
                    type: integer
                  location:
                    type: string
        "400":
          description: No disk was named
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

    post:
      tags: [backup]
      summary: Back this server up onto a disk
      description: |
        Requires `backup.run`.

        `include_data: false` copies settings only and takes seconds. `true` copies the files
        on your storage disks as well, and on a large collection can take hours — the two are
        separate because somebody wanting the first should not be made to wait for the second.

        **Homebase refuses to back up onto a disk an application keeps its files on.** A copy
        on the same disk protects against deleting a file by accident and against nothing
        else: disks fail whole, and presenting that as a backup is worse than having none.

        A backup is plain files with a JSON manifest, readable without Homebase. See
        [ADR-0014](https://github.com/HusnuOkanCakir/homebase/blob/main/docs/decisions/0014-backups-are-readable-without-homebase.md).
      operationId: createBackup
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [location]
              properties:
                location:
                  type: string
                  description: The managed storage location to write the backup to.
                include_data:
                  type: boolean
                  default: false
                  description: Copy the files on your storage disks as well as the settings.
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          description: No disk was named
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /backups/schedule:
    get:
      tags: [backup]
      summary: When backups happen by themselves
      description: |
        Requires `backup.read`.

        `enabled` is read back from systemd rather than from what was last asked for. A
        schedule recorded on disk that systemd is not running is exactly the failure this
        field exists to make visible.

        `last_result` is on this response rather than only in the job history because a
        schedule fails silently: the disk is unplugged in March and nobody finds out until the
        machine dies in November.
      operationId: getBackupSchedule
      responses:
        "200":
          description: When backups run, and how the last one went
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSchedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

    post:
      tags: [backup]
      summary: Choose how often backups run
      description: |
        Requires `backup.run`.

        `every` is one of three words, checked against a fixed table before anything is
        written. The calendar expression that ends up in a systemd unit is Homebase's, never
        the caller's — a unit file is a way to run commands as root, so no string from a
        request becomes part of one.

        The destination is checked now rather than at three in the morning: a schedule
        pointing at a disk that cannot hold a backup is a promise that fails in the dark,
        weeks later, to somebody who was told it was working.

        Turning the schedule off leaves the disk recorded, so turning it on again does not
        lose the choice.
      operationId: setBackupSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [every]
              properties:
                every:
                  type: string
                  enum: [daily, weekly, off]
                location:
                  type: string
                  description: |
                    The managed storage location backups are written to. Required unless
                    `every` is `off`.
      responses:
        "200":
          description: The schedule now in force
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSchedule"
        "400":
          description: Not a schedule Homebase can keep to, or a disk that cannot hold a backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /backups/{backup_id}/preview:
    get:
      tags: [backup]
      summary: What restoring this backup would change
      description: |
        Requires `backup.read`. **Changes nothing.**

        Its own endpoint rather than a flag on restore, because a preview a client can forget
        to ask for is a preview nobody sees. Restoring has the highest ratio of irreversible
        to understood of anything in Homebase: the user is anxious, often in a hurry, and may
        be about to overwrite something they still needed.

        `would_overwrite` is the number that actually matters — how much of what is on the
        machine now would be replaced. `verified` reports whether the backup's checksums still
        match, because restoring from an unverified backup is a guess.
      operationId: previewRestore
      parameters:
        - $ref: "#/components/parameters/BackupID"
        - $ref: "#/components/parameters/BackupLocation"
      responses:
        "200":
          description: What would change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePreview"
        "400":
          description: No disk was named
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BackupNotFound"

  /backups/{backup_id}/verify:
    post:
      tags: [backup]
      summary: Check every file in a backup against its checksum
      description: |
        Requires `backup.read`. Reads the whole backup, so on a large one this takes as long
        as writing it did.

        **A damaged backup fails the job** rather than succeeding with a footnote: somebody
        skimming the job list must not read it as fine.

        This is what catches the failures that are otherwise silent — a disk that bit-rots in
        a drawer, a backup truncated because the disk filled up, a file quietly overwritten.
        Every one of those is discovered at the worst possible moment unless something looks
        first.
      operationId: verifyBackup
      parameters:
        - $ref: "#/components/parameters/BackupID"
        - $ref: "#/components/parameters/BackupLocation"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          description: No disk was named, or the request carried settings this endpoint does not accept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BackupNotFound"

  /backups/{backup_id}/restore:
    post:
      tags: [backup]
      summary: Put a backup back onto this server
      description: |
        Requires `backup.run`, and a confirmation naming the backup.

        **A restore is a merge, not a mirror.** Nothing the backup does not contain is
        deleted: somebody recovering one application from last month's backup does not lose
        the three they added since.

        Files whose checksum no longer matches are skipped rather than written — restoring
        corruption on top of working data is the worst outcome available here.

        `confirm` must be the backup's own id, typed. This is the third operation in Homebase
        that destroys data irreversibly, and the only one where what it overwrites is usually
        what somebody is trying to save.
      operationId: restoreBackup
      parameters:
        - $ref: "#/components/parameters/BackupID"
        - $ref: "#/components/parameters/BackupLocation"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedConfirmation"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          description: No disk was named
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BackupNotFound"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"

  /backups/{backup_id}/delete:
    post:
      tags: [backup]
      summary: Delete one backup from a disk
      description: |
        Requires `backup.run` and a confirmation naming the backup. Other backups on the disk
        are untouched.
      operationId: deleteBackup
      parameters:
        - $ref: "#/components/parameters/BackupID"
        - $ref: "#/components/parameters/BackupLocation"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedConfirmation"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/BackupNotFound"
        "428":
          $ref: "#/components/responses/ConfirmationRequired"

  /network:
    get:
      tags: [network]
      summary: How this server is connected
      description: |
        Requires `network.diagnose`.

        Exists to tell three faults apart that are indistinguishable from a browser that
        will not load: the server has no address, the server has no internet, or nothing
        here is wrong and the problem is at the other end. A server that cannot make that
        distinction sends its owner to restart a router for an hour over a problem with
        their phone.

        Read live from the kernel on every request — `/sys/class/net`, `/proc/net/route`
        and `/etc/resolv.conf` — rather than from anything remembered. Reachability is
        tested by opening a TCP connection to a well-known resolver *by address*: ICMP is
        blocked on plenty of networks, and resolving a name first would make a broken
        resolver look like a broken connection.

        Slower than most reads, because deciding the internet is unreachable means waiting
        for something not to answer.
      operationId: getNetwork
      responses:
        "200":
          description: How the server is connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /network/wifi:
    get:
      tags: [network]
      summary: Whether this server has wireless, and what it has joined
      description: |
        Requires `network.diagnose`.

        `available` is false on much of the hardware Homebase runs on, and is the first thing
        a screen needs to know — "no networks in range" and "this machine cannot see networks
        at all" send somebody to entirely different places.

        `has_wired_connection` is what decides how frightening the screen has to be. Setting
        up Wi-Fi over a cable is safe, because the cable survives a failure; changing it while
        wireless is the only connection is the case that can strand the machine.

        **The passphrase is never returned**, by this or by anything else.
      operationId: getWifiStatus
      responses:
        "200":
          description: What the wireless is doing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WifiStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

    post:
      tags: [network]
      summary: Join a wireless network
      description: |
        Requires `network.modify`. **The only operation in the API that can change how this
        server is reached**, which is why it was held back from Milestone 7 until it could be
        tested.

        Homebase writes exactly one netplan file and reads none of the others, so an Ethernet
        connection is never touched: if this is being done over a cable, the cable is still
        there afterwards no matter how badly the wireless goes. Wireless takes a worse route
        metric than the cable, so a machine with both prefers the cable.

        **A failure is rolled back before this answers.** The previous configuration is put
        back and re-applied, and only then does the error return — so the caller waits for the
        rollback too, and the message can honestly say nothing has changed. The usual reason
        is a wrong password.

        Can take a minute or more: associating and getting an address is seconds, and a
        failure is that plus the rollback.
      operationId: joinWifi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ssid]
              properties:
                ssid:
                  type: string
                  maxLength: 32
                passphrase:
                  type: string
                  minLength: 8
                  maxLength: 63
                  description: |
                    Omitted for an open network. Written to a root-only file and never
                    returned by any endpoint.
      responses:
        "200":
          description: The server joined the network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WifiStatus"
        "400":
          description: Not a network name or password Wi-Fi can accept
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: This server has no wireless card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The server did not join. The previous configuration has already been put back.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /network/wifi/scan:
    post:
      tags: [network]
      summary: List the wireless networks this server can see
      description: |
        Requires `network.diagnose`. Changes nothing and does not disturb an existing
        connection.

        **A `POST` despite changing nothing.** Scanning takes seconds, tunes the radio away
        from its channel while it runs, and is something a person asks for by pressing a
        button — a `GET` that a browser may retry, prefetch or cache is the wrong shape.

        Strongest signal first, one row per network name rather than one per access point, and
        hidden networks are left out because a row that cannot be picked is worse than no row.
      operationId: scanWifi
      responses:
        "200":
          description: What the card can hear
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [networks]
                properties:
                  networks:
                    type: array
                    items:
                      $ref: "#/components/schemas/WifiNetwork"
                  message:
                    type: string
                    description: |
                      What to say when the list is empty, which is a different thing from an
                      error and needs different words.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: This server has no wireless card
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /network/wifi/forget:
    post:
      tags: [network]
      summary: Stop using wireless on this server
      description: |
        Requires `network.modify`. Removes Homebase's wireless configuration and applies the
        change.

        This can disconnect a server that is only on Wi-Fi, and is then reversible only by
        somebody who can still reach it.
      operationId: forgetWifi
      responses:
        "200":
          description: Wireless is no longer configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WifiStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /shares:
    get:
      tags: [shares]
      summary: What is shared onto the local network
      description: |
        Requires `network.diagnose`. Reports the shared folders, the accounts that may
        open them, and whether the file server is actually running — which is a separate
        fact from a share being configured, and the one worth reporting loudly. A share
        that exists while the server is stopped looks, from a laptop, exactly like a
        share that was never made.
      operationId: getShares
      responses:
        "200":
          description: The state of file sharing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"
    post:
      tags: [shares]
      summary: Share a folder onto the local network
      description: |
        Requires `network.modify`. Creates the folder, publishes it over SMB, and installs
        the file server the first time — which is an apt download and can take minutes.

        Sharing is not part of a Homebase installation. The SMB server is fetched when
        somebody asks for it, so a server nobody asked to share anything has none on it.

        The share is published to private address ranges only. The way in from outside the
        house is the VPN, where the whole tunnel is encrypted; SMB exposed to the internet
        is among the most attacked services there is.
      operationId: addShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, location]
              properties:
                name:
                  type: string
                  description: What the folder is called on the network.
                  pattern: "^[a-z][a-z0-9-]{0,30}[a-z0-9]$"
                  example: backup
                location:
                  type: string
                  description: The storage location it lives on.
                  example: internal
                read_only:
                  type: boolean
                  default: false
      responses:
        "200":
          description: The folder is shared
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  path: { type: string }
                  address: { type: string, example: "\\\\homebase\\backup" }
                  next:
                    type: string
                    description: |
                      Present when nothing can open the share yet, because no account
                      exists. That state looks exactly like success and is not.
        "400":
          description: The name is not one Homebase can use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The name is taken, or the disk is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /shares/remove:
    post:
      tags: [shares]
      summary: Stop sharing a folder
      description: |
        Requires `network.modify`. Takes the folder off the network and **leaves the files
        where they are** — "stop sharing this" and "delete my files" are different
        intentions and are not collapsed into one operation.
      operationId: removeShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200":
          description: It is no longer shared
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  removed: { type: boolean }
                  path: { type: string }
                  message: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No share by that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /files/areas:
    get:
      tags: [files]
      summary: The folders this person may browse
      description: |
        Requires `files.read`. An **area** is a shared folder or `me`, which is the caller's
        own private folder. The list is computed from their account on every request, so a
        folder kept for somebody else is not merely absent from it — it is not a name they
        can use, and naming it directly answers 404.

        A shared folder whose disk is unplugged is left out. It is still configured and still
        listed under `/shares`; browsing it would create the folder on the system disk and
        show an empty one that looks exactly like the place somebody's files used to be.

        **No path on the server is ever returned.** A browser has no use for one, and a path
        in a response is a path somebody will send back.
      operationId: listFileAreas
      responses:
        "200":
          description: The areas this person may open
          content:
            application/json:
              schema:
                type: object
                properties:
                  areas:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, description: "A share name, or `me`" }
                        name: { type: string }
                        kind: { type: string, enum: [personal, shared] }
                        read_only: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /files:
    get:
      tags: [files]
      summary: List a folder
      description: |
        Requires `files.read`.

        Names beginning with a dot are left out: they are Homebase's own housekeeping in a
        private folder — a removed person's files are kept as `.removed-<name>-<when>` — and
        the operating system's everywhere else.

        A symlink is described as what it is rather than as what it points at. Following one
        would report a size and a date for a target that opening it will refuse to reach.
      operationId: listFiles
      parameters:
        - name: area
          in: query
          required: true
          schema: { type: string }
        - name: path
          in: query
          description: A path inside the area. Empty is the top of it.
          schema: { type: string }
      responses:
        "200":
          description: What is in the folder
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  truncated:
                    type: boolean
                    description: |
                      True when the folder holds more than 5000 entries. A downloads folder
                      with forty thousand files should produce a slow screen rather than a
                      response that never finishes.
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        path: { type: string }
                        directory: { type: boolean }
                        size: { type: integer, format: int64 }
                        modified: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such area, or nothing there by that name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /files/content:
    get:
      tags: [files]
      summary: Fetch a file
      description: |
        Requires `files.read`. Supports `Range`, so a film that stops downloading on a train
        resumes rather than starts again.

        **Always `application/octet-stream`, always an attachment, always `nosniff`.** A file
        here arrived over a Windows drive mapping from a machine Homebase knows nothing
        about; served as its apparent type, an HTML file would be a page running on the
        server's own origin — the session cookie, the API, everything. Downloading is what a
        file browser is for; rendering is not.
      operationId: downloadFile
      parameters:
        - name: area
          in: query
          required: true
          schema: { type: string }
        - name: path
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: Part of the file, for a resumed download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such area, or nothing there by that name
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /files/upload:
    post:
      tags: [files]
      summary: Put a file into a folder
      description: |
        Requires `files.write`. `multipart/form-data`, streamed rather than parsed: the
        fields `area` and `path` **must come before the file**, because the destination has
        to be known before a byte is written anywhere.

        The upload is written under a temporary dotted name in the destination folder and
        renamed when it is complete, so an upload that fails halfway leaves nothing rather
        than a file that looks finished and is not.

        The name a browser sends is reduced to its last element. A folder upload sends
        `photos/holiday/one.jpg`, and the directories in it are not this endpoint's to
        create.
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [area, file]
              properties:
                area: { type: string }
                path: { type: string }
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: What was saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: array
                    items: { type: string }
        "400":
          description: No file, or a name no file can have
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: No permission, or the folder is shared read-only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /files/folder:
    post:
      tags: [files]
      summary: Make a folder
      description: |
        Requires `files.write`. One folder, not a path: `name` that turns out to contain a
        separator is a mistake rather than an instruction, and is refused.

        Names are held to what **Windows** can open, which is stricter than Linux. A file
        called `report?` or one ending in a space cannot be opened from the machine most of
        a household uses, and creating it would produce a file that is invisible there with
        nothing to explain it. A leading dot is refused too, because listings hide those and
        the folder would vanish the moment it was made.
      operationId: createFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [area, name]
              properties:
                area: { type: string }
                path: { type: string }
                name: { type: string }
      responses:
        "201":
          description: The folder was made
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
        "400":
          description: A name Homebase will not create
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /files/rename:
    post:
      tags: [files]
      summary: Rename a file or folder
      description: |
        Requires `files.write`. A new **name**, not a new place: it stays in the folder it is
        in. Moving between folders is a different operation with a different way to go wrong,
        and offering both through one endpoint would make the careless call the destructive
        one.

        Refuses rather than overwriting something already called that.
      operationId: renameFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [area, path, name]
              properties:
                area: { type: string }
                path: { type: string }
                name: { type: string }
      responses:
        "200":
          description: Its new path inside the area
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Something here is already called that
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /files/remove:
    post:
      tags: [files]
      summary: Delete a file or folder
      description: |
        Requires `files.write`. **There is no wastebasket.**

        A folder with anything in it needs its own name typed in `confirm`. One file does
        not: asking for a confirmation to delete a single file makes an ordinary action
        tedious enough that people stop reading it, and the difference between that and
        deleting a folder is five hundred photographs.

        An unconfirmed delete can never take a subtree with it — the recursive form runs only
        after the name has been typed.

        The area itself cannot be deleted here. Stopping a share is a different action and
        leaves the files where they are.
      operationId: removeFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [area, path]
              properties:
                area: { type: string }
                path: { type: string }
                confirm:
                  type: string
                  description: The folder's own name. Required for a folder that is not empty.
      responses:
        "200":
          description: It is gone
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A folder that is not empty, with no confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /shares/access:
    post:
      tags: [shares]
      summary: Choose who may open a shared folder
      description: |
        Requires `accounts.manage` — this is a question about people rather than about the
        network, and it is the one share operation that can put somebody's files in front of
        the whole house without touching a disk.

        An empty or absent `access` list means everybody with an account, which is what every
        share is until somebody says otherwise. **There is no way to say "nobody"**: a folder
        nobody can open is not a state anybody wants and is one a typo could produce.

        Every name must belong to an existing account. A name that belongs to nobody would be
        written into Samba's `valid users` and simply never match, leaving a folder that is
        restricted to nobody and looks restricted to somebody.

        Names are kept when somebody is removed from the server. A stale name is a door that
        stays shut, whereas tidying it away could empty the list — and an empty list means
        everybody.
      operationId: setShareAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{0,30}[a-z0-9]$"
                access:
                  type: array
                  description: Homebase usernames. Empty means everybody with an account.
                  items:
                    type: string
                    pattern: "^[a-z][a-z0-9-]{0,30}[a-z0-9]$"
      responses:
        "200":
          description: Who may open the folder was changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  access:
                    type: array
                    items: { type: string }
                  everyone: { type: boolean }
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422":
          description: A name that belongs to nobody on this server
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /shares/users:
    post:
      tags: [shares]
      summary: Create or change a file-sharing password
      description: |
        Requires `network.modify`. Creates the account if it is new and sets the password
        typed on the computer that connects.

        The account has no shell and no password on the machine itself, and its name is
        prefixed, so it is a way to open a folder and never a way to log in. The password
        reaches hostd and goes no further: the operation declares it a secret, so the audit
        log records that it was set and never what it was set to.
      operationId: setSharePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{0,30}[a-z0-9]$"
                password:
                  type: string
                  minLength: 8
                  description: |
                    At least eight characters. This is typed once and saved by the computer
                    that connects, so it is never changed and never remembered — which is
                    an argument for length rather than for character classes.
      responses:
        "200":
          description: The account can now open the shared folders
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  login:
                    type: string
                    description: The full name to type, including the prefix.
                  message: { type: string }
        "400":
          description: The name or the password is not acceptable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Nothing is shared yet, so there is nothing to have a password for
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /shares/users/remove:
    post:
      tags: [shares]
      summary: Stop somebody being able to open the shared folders
      description: Requires `network.modify`. Removes the account. No files are touched.
      operationId: removeShareUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        "200":
          description: The account is gone
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  removed: { type: boolean }
                  message: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /network/wake-on-lan:
    post:
      tags: [network]
      summary: Let a magic packet start this server, or stop it
      description: |
        Requires `network.modify`. Changes the setting in the card now and records it, so
        that hostd puts it back after a restart — the driver resets it on every boot.

        Only half of wake-on-LAN is software. The other half is the machine's firmware,
        which no running system can read or change: a laptop whose BIOS has power saving
        switched on for the off state cuts power to the network card, and no packet reaches
        it however this endpoint is set. The response says so rather than reporting plain
        success, because a server that looks configured and stays dark is one somebody has
        to walk to.
      operationId: setWakeOnLAN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interface, enabled]
              properties:
                interface:
                  type: string
                  description: The network card, as named by `GET /network`.
                  example: enp5s0
                enabled:
                  type: boolean
                  description: |
                    Required rather than defaulted. A body that omits it is refused: reading
                    a missing field as "switch it off" would silently do the opposite of
                    what the caller asked, and nobody finds out until the machine will not
                    start.
      responses:
        "200":
          description: The card was changed and the change was recorded
          content:
            application/json:
              schema:
                type: object
                required: [interface, enabled]
                properties:
                  interface:
                    type: string
                  enabled:
                    type: boolean
                  note:
                    type: string
                    description: |
                      What Homebase cannot do, when switching it on: where to look in the
                      firmware if the machine still will not start.
        "400":
          description: |
            No such card, or one whose driver has no wake-on-LAN at all. Wireless cards
            usually do not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /network/vpn:
    get:
      tags: [network]
      summary: Whether this server can be reached from outside the house
      description: |
        Requires `network.diagnose`.

        `ever_connected` is the reachability check, and it is evidence rather than a probe: a
        completed handshake proves the name resolved, the router forwarded the port and the
        key was accepted. Asking properly whether a port is forwarded means asking a service
        outside the house, which is the dependency
        [ADR-0019](https://github.com/HusnuOkanCakir/homebase/blob/main/docs/decisions/0019-remote-access-is-self-hosted-wireguard.md)
        exists to avoid — so it is not asked.

        No private key appears in this response, or in any other except the one that creates
        a device.
      operationId: getVPNStatus
      responses:
        "200":
          description: What remote access is doing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

    post:
      tags: [network]
      summary: Switch on remote access
      description: |
        Requires `network.modify`.

        `hostname` is what devices will be told to connect to — a dynamic DNS name, or a fixed
        address for a household that has one.

        Run again on a server that already has devices, it changes the name and **keeps the
        server's key and every peer**. Regenerating the key would silently invalidate every
        device already handed out, which somebody discovers on holiday.

        One thing is left that Homebase cannot do: forwarding the UDP port on the router.
        UPnP would automate it and is a hole this project will not open on somebody's network.
      operationId: setUpVPN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hostname]
              properties:
                hostname:
                  type: string
                  maxLength: 253
      responses:
        "200":
          description: Remote access is on
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNStatus"
        "400":
          description: Not a name a device could connect to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /network/vpn/disable:
    post:
      tags: [network]
      summary: Switch remote access off, keeping the keys
      description: |
        Requires `network.modify`. Stops the tunnel and **closes the port in the firewall**,
        in that order — the port is closed first and unconditionally, so a failure to stop
        the service leaves a Wireguard nothing on the internet can reach rather than an open
        door somebody was told had been shut.

        The keys stay. "Switch this off" and "forget every device I have set up" are
        different intentions, and collapsing them would mean turning remote access off for
        an afternoon costs re-issuing a configuration to every phone in the house.

        This is the rollback `POST /network/vpn` has always named. It did not exist until
        the port-opening did, which meant there was a way to open a port to the whole
        internet and none to shut it.
      operationId: disableVPN
      responses:
        "200":
          description: Remote access is off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /network/vpn/devices:
    post:
      tags: [network]
      summary: Let one more device connect from outside
      description: |
        Requires `network.modify`.

        **The response contains a private key, and it is the only chance to read it.** The
        server generates both halves — it must, because a phone joins by scanning a QR code
        and that code has to contain the key — and then stores only the public half.

        A configuration that is lost cannot be re-shown. Remove the device and add it again.
        That is a deliberate cost: every comparable tool keeps client configurations on the
        server, which is convenient and means one compromise yields every device's identity.

        The same "shown once" model as the recovery code at setup, for the same reason.
      operationId: addVPNDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 31
                  description: A label — "phone", "work laptop".
      responses:
        "201":
          description: The device, and its configuration, once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewVPNDevice"
        "400":
          description: Not a name Homebase can give a device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Remote access is not set up, or that name is taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /network/vpn/devices/remove:
    post:
      tags: [network]
      summary: Stop a device connecting from outside
      description: |
        Requires `network.modify`. This is the remedy for a lost phone, so it asks once rather
        than making somebody name the device twice in a hurry.

        It cannot be undone in the sense that matters: adding the device again issues a *new*
        key, and the old configuration stays dead.
      operationId: removeVPNDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "200":
          description: The device can no longer connect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VPNStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: There is no device by that name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /network/vpn/dns:
    post:
      tags: [network]
      summary: Keep a dynamic DNS name pointing at this house
      description: |
        Requires `network.modify`.

        A home connection's address changes, and the name devices connect to has to follow
        it. This is the one outside dependency in
        [ADR-0019](https://github.com/HusnuOkanCakir/homebase/blob/main/docs/decisions/0019-remote-access-is-self-hosted-wireguard.md),
        kept as small as it can be: a name, a token, and a URL to poll.

        `provider` is a **word from a fixed table**, never a URL. A URL from the caller would
        be a way to make the machine fetch an arbitrary address as root, which is the generic
        execution path [ADR-0006](https://github.com/HusnuOkanCakir/homebase/blob/main/docs/decisions/0006-privilege-split.md)
        exists to prevent, wearing a different hat.

        `token` is declared secret on the underlying privileged operation, so it is redacted
        from the audit log — which is append-only and kept indefinitely.
      operationId: setDynamicDNS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, name]
              properties:
                provider:
                  type: string
                  enum: [duckdns]
                name:
                  type: string
                  maxLength: 253
                token:
                  type: string
      responses:
        "200":
          description: The name is being kept up to date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicDNS"
        "400":
          description: Not a provider Homebase can update, or not a name it could keep
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /network/vpn/dns/clear:
    post:
      tags: [network]
      summary: Stop keeping a dynamic DNS name up to date
      description: |
        Requires `network.modify`. The name stops being updated, so it will point at a stale
        address as soon as the household's changes.
      operationId: clearDynamicDNS
      responses:
        "200":
          description: Nothing is being kept up to date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicDNS"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /system/diagnostics:
    post:
      tags: [system]
      summary: Collect what somebody would need to work out why this server is unwell
      description: |
        Requires `system.manage`.

        Writes a plain-text file on the server and reports what is in it. Download it with
        `/system/diagnostics/download`.

        **`excludes` is part of the answer, not documentation.** It is the list somebody
        checks before sending the file to a stranger, so it travels with the result: the
        failure mode of a support bundle is not being unhelpful, it is quietly containing the
        password database.

        What is collected is a fixed list — versions, service states, failed units, a day of
        the journal, disks, free space, memory, addresses, apt's view of the update source,
        and whether dpkg left a transaction unfinished. Nothing in it comes from the request:
        a bundle that could be told what to run would be the generic execution path
        [ADR-0006](https://github.com/HusnuOkanCakir/homebase/blob/main/docs/decisions/0006-privilege-separation.md)
        exists to prevent, wearing a support tool's clothes.

        A command that is missing or fails does not fail the bundle. Half a bundle from a
        badly broken machine is what somebody needs.
      operationId: collectDiagnostics
      responses:
        "200":
          description: The diagnostic file, and what it does and does not contain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diagnostics"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /system/diagnostics/download:
    get:
      tags: [system]
      summary: Download the most recent diagnostic file
      description: |
        Requires `system.manage`.

        The newest file, rather than one named by the caller. A filename in a request is a
        path to be validated, and the validation is the part that gets subtly wrong; there is
        nothing to get wrong if there is no filename.
      operationId: downloadDiagnostics
      responses:
        "200":
          description: The file
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No diagnostic file has been made yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /system/repair:
    post:
      tags: [system]
      summary: Put back the things a broken or interrupted install leaves wrong
      description: |
        Requires `system.manage`.

        A fixed list of checks, each of which makes something true if it is not: finish a
        package transaction dpkg left unfinished, recreate Homebase's directories and give
        them back to the service account, start and enable the services.

        **It is not a diagnosis.** There is no branching on what a previous step found,
        because a repair tool that reasons about the state of a broken machine is a program
        written against inputs nobody has seen. Every step reports what it did, and doing
        nothing is a result — `changed: 0` means whatever is wrong is not something this knows
        how to fix, which is more use than a list of ticks.

        Nothing here deletes anything, which is what makes it safe to offer to somebody who
        does not know what is wrong.
      operationId: repairSystem
      responses:
        "200":
          description: What was checked and what was changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /system/factory-reset:
    post:
      tags: [system]
      summary: Return this server to how it was before anybody set it up
      description: |
        Requires `system.manage`. **The most destructive operation in Homebase.**

        It removes every account and every setting, so the person running it can lock
        themselves out of their own server. `confirm` must be the server's hostname — the one
        string specific to this machine, which is what stops a reset meant for one server
        landing on another.

        `keep_data` defaults to **true**, and its absence means true rather than false. A
        caller that forgets the field keeps the photographs.

        The update channel is deliberately kept. A machine that forgets where its security
        updates come from is worse than one that remembers, and it is not personal data.

        Afterwards the server asks to be set up again, like a new one.
      operationId: factoryReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: This server's hostname, typed exactly.
                keep_data:
                  type: boolean
                  default: true
                  description: |
                    Leave everything in `/srv/homebase` — your files and your applications'
                    data — alone. Absent means true.
      responses:
        "200":
          description: What was removed and what was left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryResetResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "428":
          description: The server's name was not typed correctly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HostUnavailable"

  /system/update:
    get:
      tags: [update]
      summary: What version this server is running
      description: |
        Requires `update.read`.

        Reports the four packages an installation is made of rather than a single version
        string, because the interesting failure is that they disagree. They depend on each
        other with `(= version)`, so apt cannot produce a mixed set deliberately — only an
        interrupted update or a manual `dpkg` can, and a machine in that state usually still
        works, which is exactly why nothing else would notice.

        `interrupted` is separate from `consistent` and is found differently: a package
        dpkg left `half-configured` or `unpacked`, or a journal it did not replay. A machine
        can be either without being the other, and both need `dpkg --configure -a` before
        anything else will install.

        `channel` is read from apt's own source file rather than from a Homebase setting,
        because apt's file is what actually decides where packages come from. It is empty on
        a machine installed from media, which has no update source until one is configured.

        See [ADR-0018](../docs/decisions/0018-updates-are-a-signed-apt-repository.md).
      operationId: getUpdateStatus
      responses:
        "200":
          description: What this machine is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /system/update/progress:
    get:
      tags: [update]
      summary: How far an update has got
      description: |
        Requires `update.read`.

        `result` is empty while the update is still running, and that emptiness is how a
        client tells "in progress" from "finished" — `core` cannot remember anything across
        an update, because the update restarts it.

        `running` is asked of systemd rather than inferred from the file. A machine that lost
        power mid-update comes back with a stage recorded and nothing running, which must not
        read as an update still in progress for ever.
      operationId: getUpdateProgress
      responses:
        "200":
          description: Where the update got to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /system/update/check:
    post:
      tags: [update]
      summary: Ask whether a newer version has been published
      description: |
        Requires `update.read`.

        A POST rather than a GET because it reaches the network and refreshes apt's index —
        it changes nothing this server runs, but it is not a cheap repeatable read either.

        `reachable` is reported separately from `update_available`. They are the same
        silence and very different facts: one means you are up to date, the other means you
        cannot find out.
      operationId: checkForUpdate
      responses:
        "200":
          description: What the channel offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /system/update/channel:
    post:
      tags: [update]
      summary: Choose which channel this server updates from
      description: |
        Requires `update.manage`.

        The channel is validated against four literal words before it reaches apt's
        configuration, because that file decides which code this machine will run as root.

        `reachable` says whether the newly configured channel actually answered with an index
        that verified. A failure there is reported rather than fatal: a machine that was
        offline when its channel changed has still had its channel changed, and refusing to
        record that would leave the file and the report disagreeing.
      operationId: setUpdateChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [development, alpha, beta, stable]
      responses:
        "200":
          description: The channel this server now updates from
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateChannel"
        "400":
          description: Not a channel Homebase publishes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"

  /system/update/apply:
    post:
      tags: [update]
      summary: Install the version this server's channel offers
      description: |
        Requires `update.manage`.

        **Returns `202` and does not wait**, and unlike the rest of the API that is
        structural rather than convention. The update replaces `homebase-hostd` and
        `homebase-core` and restarts them, so the process holding this request open is the
        process being replaced. There is no arrangement in which a response could describe
        the outcome. Poll `/system/update/progress`.

        Everything is downloaded and verified before anything is applied, so a failure while
        fetching changes nothing. The database and `/etc/homebase` are snapshotted first, the
        server is health-checked afterwards, and a failed check puts the previous version and
        the snapshot back.

        Refused with `409` if an earlier update did not finish: starting a new transaction on
        a machine with an unfinished one is how a recoverable state becomes an unrecoverable
        one.

        See [ADR-0018](../docs/decisions/0018-updates-are-a-signed-apt-repository.md).
      operationId: applyUpdate
      responses:
        "202":
          description: The update was started. It has not finished.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [started]
                properties:
                  started:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: This server is not in a state where an update can be started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/Unavailable"

  /auth/recover:
    post:
      tags: [auth]
      summary: Set a new password using a recovery code
      description: |
        The only unauthenticated way to change a credential in Homebase, and the reason
        [ADR-0015](../docs/decisions/0015-password-recovery.md) exists: there is no email
        to send a link to, no second device, and frequently no internet. The secret is
        held by the user, on paper, and this is where it is spent.

        The code is compared case-insensitively with separators ignored, and `O`, `I` and
        `L` are folded onto `0` and `1` — the alphabet excludes them precisely so that
        handwriting can be forgiven.

        On success: the password is replaced, **every session for that account is
        destroyed**, the caller is signed in, and a replacement code is returned. It is
        returned once and stored only as an argon2id hash.

        A wrong code, an unknown username and an account with no code are answered
        identically. Distinguishing them would say which accounts are worth attacking.
      operationId: recoverPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, recovery_code, new_password]
              properties:
                username:
                  type: string
                recovery_code:
                  type: string
                  description: As written down, in any case, with or without separators.
                  example: 7K2M9-QRVWX-3TZ4P-HNBCD-8FGJ5
                new_password:
                  type: string
                  minLength: 12
      responses:
        "200":
          description: |
            The password was replaced and the caller is signed in. `recovery_code` is the
            replacement, shown once — a user who recovers and is left without one is a
            single forgotten password from where they started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveredSession"
        "401":
          description: |
            The code was not right. Deliberately the same answer for an unknown account
            and for an account that has no recovery code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The new password is shorter than the minimum.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /auth/recovery-code:
    get:
      tags: [auth]
      summary: Whether this account has a recovery code
      description: |
        Never the code itself, which is stored the way a password is and cannot be shown
        twice. This exists so somebody can discover they never wrote one down at a moment
        when that is still fixable, rather than when they are already locked out.
      operationId: getRecoveryStatus
      responses:
        "200":
          description: The state of this account's recovery code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [auth]
      summary: Issue a new recovery code
      description: |
        Replaces the current code, which stops working immediately. This is the answer to
        lost paper, and the reason no reversible copy of a code needs to exist anywhere.

        The password is unchanged and no session is ended: this is not a recovery, it is
        a replacement key.
      operationId: reissueRecoveryCode
      responses:
        "200":
          description: The new code, shown once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_code]
                properties:
                  recovery_code:
                    type: string
                    example: 7K2M9-QRVWX-3TZ4P-HNBCD-8FGJ5
        "401":
          $ref: "#/components/responses/Unauthorized"

  /events:
    get:
      tags: [events]
      summary: List events
      description: |
        Structured events, not log text. Consumers — including the Stage 2 operator — must
        never have to parse a human-readable string to learn what happened.
      operationId: listEvents
      parameters:
        - name: severity
          in: query
          schema:
            $ref: "#/components/schemas/EventSeverity"
        - name: since
          in: query
          description: |
            Return only events after this instant. This is how a client that was disconnected
            catches up, which is what makes the live stream safe to be lossy.
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "400":
          description: An unparseable `since` or an unknown `severity`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /events/stream:
    get:
      tags: [events]
      summary: Stream events as they happen
      description: |
        Server-sent events. One `data:` line per event, in the same shape as `GET /events`,
        with comment lines as a heartbeat — a home network puts a router between the browser
        and this server, and routers close idle connections without telling either end.

        **The stream is a convenience, never the source of truth.** It is lossy by design: a
        subscriber that stops reading is skipped rather than allowed to block the operation
        that produced the event. A client that missed events while disconnected re-reads
        `GET /events?since=…`, which is why that parameter exists.

        SSE rather than a WebSocket: this is one-way, it inherits the session cookie, every
        proxy in between already understands it, and the browser reconnects on its own.
      operationId: streamEvents
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Live updates are not available on this server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: homebase_session
      description: Set at sign-in. `HttpOnly`, `Secure`, `SameSite=Lax`.
    bearerToken:
      type: http
      scheme: bearer
      description: |
        API token for `homebasectl` and, later, the AI operator. Tokens carry a permission
        set and are individually revocable — so revoking the AI's access does not mean
        revoking the user's.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        A repeated key returns the original job rather than starting a second one.

        Not an edge case: a user on poor Wi-Fi will press a button twice, and an automated
        client that loses a connection mid-request will retry.
      schema:
        type: string
        format: uuid
    AppID:
      name: app_id
      in: path
      required: true
      description: |
        The application's stable id, as it appears in its manifest. Also the name of the
        directory its data lives in, which is why it is deliberately restrictive.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
    BackupID:
      name: backup_id
      in: path
      required: true
      description: |
        A backup's id — the date it was taken, then some randomness. Sortable, so listing
        newest-first needs no manifest parsing, and readable, so somebody looking at four
        folders on a disk can tell which is which without opening any of them.
      schema:
        type: string
        pattern: "^[a-z0-9-]{10,64}$"
    BackupLocation:
      name: location
      in: query
      required: true
      description: |
        The managed storage location the backups are on. Required everywhere: a backup lives
        on a disk, and which disk is not something Homebase guesses.
      schema:
        type: string
    LocationID:
      name: location_id
      in: path
      required: true
      description: A managed storage location's id.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,30}[a-z0-9]$"
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `next_cursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

  responses:
    AppNotFound:
      description: |
        This server has no such application. Not "not installed" — the manifest is not on the
        machine at all, and no package ships it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BackupNotFound:
      description: That backup is not on this disk.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    LocationNotFound:
      description: This server has no storage location by that name.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ConfirmationRequired:
      description: |
        The request did not name what it was acting on. `428` rather than `400`: nothing is
        wrong with the request's shape, a precondition simply is not met yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyAttempts:
      description: |
        Too many failed attempts from this address. Every endpoint that verifies a
        password or a recovery code costs 64 MiB of memory by design, so an unlimited one
        is a way to exhaust a machine that may only have four gigabytes — and none of
        them needs a credential to reach. `Retry-After` says how long to wait.

        Successful attempts are refunded: rationing correct sign-ins would punish the
        household rather than the attacker.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before trying again
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HostUnavailable:
      description: |
        `hostd` could not be reached, so the machine's real state is unknown. Deliberately not
        an empty result: "Homebase cannot see the server" and "the server has nothing" are
        different facts and must not look the same.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    JobAccepted:
      description: Accepted. Poll the job for progress.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Job"
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated, but lacking the required permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Temporarily unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    PowerRequest:
      type: object
      description: |
        Naming the machine that is about to stop being available.

        `confirm` must equal this server's hostname. A confirmation that is just "yes" is
        one that can be obtained for one machine and spent on another — which matters more
        as soon as something other than a person is proposing the operation.
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: string
          maxLength: 63
          description: This server's hostname, exactly.
        reason:
          type: string
          maxLength: 500
          description: Recorded in the audit log.

    ShareStatus:
      type: object
      description: |
        File sharing on this server. `installed` and `running` are separate facts from
        there being shares: "configured but not running" is a real state, and from the
        other end it is indistinguishable from nothing having been set up.
      properties:
        installed:
          type: boolean
          description: Whether the SMB server is on this machine at all.
        running:
          type: boolean
        server_name:
          type: string
          description: What this machine answers to on the network.
        users:
          type: array
          description: |
            The accounts that may connect, without their prefix. Names only — Homebase
            cannot read a password back and would not report one if it could.
          items: { type: string }
        shares:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              location: { type: string }
              path: { type: string }
              read_only: { type: boolean }
              available:
                type: boolean
                description: |
                  Whether the disk holding it is connected. A share whose disk is
                  unplugged is still configured and has nothing behind it, which is
                  not the same as not being shared.
              address:
                type: string
                description: What to type on another machine.
    DynamicDNS:
      type: object
      additionalProperties: false
      required: [configured, enabled, working]
      description: |
        No token appears here. It travels one way, into a root-only file.
      properties:
        configured:
          type: boolean
        provider:
          type: string
        name:
          type: string
        enabled:
          type: boolean
          description: Whether systemd is actually keeping it up to date.
        working:
          type: boolean
          description: |
            Whether the last update succeeded. A name that stopped updating three weeks ago
            is a server nobody can reach, and it looks identical to one that is fine.
        last_checked:
          type: string
          format: date-time
        detail:
          type: string

    VPNStatus:
      type: object
      additionalProperties: false
      required: [configured, running, port, devices, ever_connected]
      properties:
        configured:
          type: boolean
        running:
          type: boolean
          description: |
            Whether the interface is actually up. Separate from `configured` for the same
            reason the backup schedule's `enabled` is: a configuration nothing is acting on
            is the failure worth seeing.
        hostname:
          type: string
        port:
          type: integer
          description: The UDP port that has to be forwarded on the router.
        devices:
          type: array
          items:
            $ref: "#/components/schemas/VPNDevice"
        ever_connected:
          type: boolean
          description: |
            Whether any device has ever completed a handshake. This is the reachability
            check — evidence rather than a probe.
        dns:
          $ref: "#/components/schemas/DynamicDNS"
        tailscale:
          $ref: "#/components/schemas/TailscaleStatus"
        message:
          type: string

    TailscaleStatus:
      type: object
      additionalProperties: false
      required: [installed, running]
      description: |
        What Tailscale is doing on this machine, if it is here at all.

        **Homebase does not manage Tailscale.** It does not install, configure, start or
        stop it; this is read from tailscaled's local API and reported. Taking ownership
        would mean owning its upgrades, its login state and its failures, for something
        that manages itself perfectly well.

        It is reported here, beside Wireguard, because they answer the same question. On a
        connection behind carrier-grade NAT the Wireguard half can never work however
        correctly it is configured, and a remote-access endpoint that names only the part
        Homebase controls is accurate about itself and misleading about the machine.
      properties:
        installed:
          type: boolean
          description: Whether tailscaled is present and answering at all.
        running:
          type: boolean
          description: |
            Whether it is logged in and carrying traffic. Separate from `installed` because
            an installed daemon awaiting login is the state most worth naming: everything
            looks present and nothing works.
        state:
          type: string
          description: |
            The daemon's own word — `Running`, `NeedsLogin`, `Stopped`. Passed through
            rather than translated, because it is the word Tailscale's own documentation
            and error messages use.
          example: Running
        name:
          type: string
          description: |
            What this machine answers to inside the tailnet, and what somebody types from
            away. Note this is *not* the `.local` name, which is mDNS and does not cross a
            tunnel of any kind.
          example: homebase.tail9c4e2.ts.net
        addresses:
          type: array
          items: { type: string }
          description: Its tailnet addresses, the 100.x one first.

    Account:
      type: object
      additionalProperties: false
      required: [id, username, role, has_signed_in, created_at]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        has_signed_in:
          type: boolean
          description: |
            Whether this person has ever signed in. An invitation nobody has accepted and an
            account in daily use look identical without it.
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }

    Role:
      type: string
      enum: [administrator, member, limited]
      description: |
        A name for a set of permissions. The permissions are the real thing — every check in
        the server is against one of them — and a role is a way of choosing a sensible set
        without reading fourteen checkboxes and getting one wrong.

        `administrator` can change anything about the server, including reading every file on
        it. `member` has their own files and can see how the server is doing, but cannot
        change it. `limited` has their own files and nothing else.

        `assistant.unrestricted` belongs to no role and is granted only at the machine.

    VPNDevice:
      type: object
      additionalProperties: false
      required: [name, address, public_key]
      properties:
        name:
          type: string
        address:
          type: string
          description: Its address inside the VPN.
        public_key:
          type: string
          description: |
            The public half. The private half was shown once and is not stored, so it is not
            here — it is nowhere.
        last_handshake:
          type: string
          format: date-time
        transfer_rx:
          type: integer
        transfer_tx:
          type: integer

    NewVPNDevice:
      type: object
      additionalProperties: false
      required: [name, address, public_key, config, message]
      description: |
        A device and its configuration. **The only response in the API besides the recovery
        code at setup that contains a private key**, and the only chance to read it.
      properties:
        name:
          type: string
        address:
          type: string
        public_key:
          type: string
        last_handshake:
          type: string
        transfer_rx:
          type: integer
        transfer_tx:
          type: integer
        config:
          type: string
          description: |
            The whole client configuration, including the private key. Returned once, by the
            call that created it, and stored nowhere.
        qr_code:
          type: string
          description: The same configuration as a QR code, drawn with block characters.
        message:
          type: string

    WifiStatus:
      type: object
      additionalProperties: false
      required: [available, connected, configured, has_wired_connection]
      properties:
        available:
          type: boolean
          description: Whether this machine has a wireless card at all.
        interface:
          type: string
        connected:
          type: boolean
          description: |
            Asked of the kernel rather than inferred from having an address: an interface can
            hold a stale address after the network has gone.
        ssid:
          type: string
        addresses:
          type: array
          items:
            type: string
        signal:
          type: integer
          description: Strength in dBm — negative, closer to zero is better.
        bars:
          type: integer
          minimum: 0
          maximum: 4
        configured:
          type: boolean
          description: |
            Whether Homebase has written a wireless configuration. Separate from `connected`:
            a configured network that is not joined is a state somebody needs to see, and it
            looks like nothing at all otherwise.
        has_wired_connection:
          type: boolean
          description: |
            Whether a cable is also carrying an address. What decides how frightening the
            screen has to be.

    WifiNetwork:
      type: object
      additionalProperties: false
      required: [ssid, signal, bars, security, current]
      properties:
        ssid:
          type: string
        signal:
          type: integer
        bars:
          type: integer
          minimum: 0
          maximum: 4
        security:
          type: string
          enum: [open, wep, wpa, wpa3]
          description: In the words needed to warn somebody, not to configure anything.
        current:
          type: boolean

    NetworkStatus:
      type: object
      additionalProperties: false
      required: [hostname, mdns_name, mdns_works, interfaces, online, reachable]
      properties:
        hostname:
          type: string
        mdns_name:
          type: string
          description: The `.local` name this server answers to.
          example: attic.local
        mdns_works:
          type: boolean
          description: |
            Whether anything is actually publishing that name. Claimed only when a
            responder is running: reporting a name the network cannot resolve is worse
            than reporting none, because it sends somebody to type an address that will
            never load.
        reachable:
          type: boolean
          description: |
            Whether this server has an address on something other than loopback — that is,
            whether it can be reached from another room at all.
        online:
          type: boolean
          description: |
            Whether anything outside this network answered. Deliberately separate from
            `reachable`: a server with a perfectly good address on a network whose
            broadband is down is a different problem from a server with no address, and
            telling somebody "not connected" when their server is fine sends them to the
            wrong place entirely.
        gateway:
          type: string
          description: The router everything else goes through. Absent means there is no
            route off this machine, which is not the same as a route that does not work.
        nameservers:
          type: array
          items:
            type: string
        interfaces:
          type: array
          items:
            $ref: "#/components/schemas/NetworkInterface"

    NetworkInterface:
      type: object
      additionalProperties: false
      required: [name, kind, up]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [ethernet, wireless, loopback, container]
          description: What a person would call it, rather than what the kernel does.
        up:
          type: boolean
          description: |
            The kernel's operational state, which is the honest answer to "is there a cable
            in it": a socket with nothing plugged in reports down even when the interface
            is configured.
        addresses:
          type: array
          items:
            type: string
          description: |
            Link-local addresses are deliberately excluded. A machine that has only handed
            itself one has not been given an address by anybody, and listing 169.254.x.x
            would read as a working network to somebody with no way to know otherwise.
        mac:
          type: string
          description: What the router's list of connected devices matches against, which
            is a real thing people have to do — and what a wake-up packet is addressed to.
        wake_on_lan:
          type: boolean
          description: |
            Whether this card will start the machine when a magic packet arrives. Reported
            because nothing on a sleeping machine can run a command, so this has to be known
            *before* it goes to sleep.
        wake_on_lan_supported:
          type: boolean
          description: |
            Whether the card *could* be woken, whether or not it currently is. Three states
            rather than two, and "supported but switched off" is the only actionable one —
            saying "cannot be woken" about hardware that can is accurate and useless.

    UpdateStatus:
      type: object
      additionalProperties: false
      required: [version, consistent, interrupted, components, channel, origin]
      properties:
        version:
          type: string
          description: |
            The version of `homebase-core`, because that is the component somebody is
            actually running. Empty if it is not installed, which on a working machine
            cannot happen.
        consistent:
          type: boolean
          description: |
            Whether every installed component reports the same version. False means an
            update stopped part way: every package can read as fully installed and still
            disagree, which is the failure a single version string would hide.
        interrupted:
          type: boolean
          description: |
            Whether dpkg has work it did not finish — a package left `half-configured` or
            `unpacked`, or a journal it never replayed. Needs `dpkg --configure -a` before
            anything else can be installed.
        components:
          type: array
          items:
            $ref: "#/components/schemas/Component"
        channel:
          type: string
          description: |
            The suite this machine subscribes to. Empty when no update source is configured,
            which is where every machine installed from media starts.
          enum: ["", development, alpha, beta, stable]
        origin:
          type: string
          description: Where updates would come from. Reported so a machine pointed at the
            wrong repository is visible rather than merely quiet.

    Component:
      type: object
      additionalProperties: false
      required: [package, version, state]
      properties:
        package:
          type: string
          enum: [homebase-hostd, homebase-core, homebase-apps, homebase-dashboard]
        version:
          type: string
          description: Empty when the package is not installed.
        state:
          type: string
          description: |
            dpkg's own word, passed through rather than reduced to a boolean. The difference
            between `not-installed` and `half-configured` is the difference between a
            machine that needs an install and one that needs finishing.

    UpdateCheck:
      type: object
      additionalProperties: false
      required: [current, available, update_available, channel, reachable]
      properties:
        current:
          type: string
          description: The version installed now.
        available:
          type: string
          description: What the channel offers. Empty when the archive did not answer.
        update_available:
          type: boolean
          description: |
            Computed by `dpkg --compare-versions` rather than by comparing strings. Debian
            ordering has epochs and tildes that sort before the empty string, and getting it
            wrong means either hiding a real update or accepting a downgrade.
        channel:
          type: string
        reachable:
          type: boolean
          description: Whether the archive answered with an index that verified.
        detail:
          type: string
          description: What went wrong, in apt's words, when it did not.

    UpdateChannel:
      type: object
      additionalProperties: false
      required: [channel, origin, reachable]
      properties:
        channel:
          type: string
          enum: [development, alpha, beta, stable]
        origin:
          type: string
        reachable:
          type: boolean
        detail:
          type: string

    UpdateProgress:
      type: object
      additionalProperties: false
      required: [stage, running]
      properties:
        stage:
          type: string
          description: |
            Where the update got to. Empty if none has ever been started on this server.
          enum: ["", refreshing, downloading, snapshot, applying, health,
                 rolling-back, rolled-back, rolled-back-failed, done]
        result:
          type: string
          description: |
            Empty while the update is still running. That emptiness is the signal: `core`
            cannot remember anything across an update, because the update restarts it.
          enum: [ok, failed]
        from:
          type: string
        to:
          type: string
        detail:
          type: string
          description: What went wrong, and what was done about it.
        running:
          type: boolean
          description: |
            Whether systemd still has the update unit active. Asked as well as reading the
            stage, because a machine that lost power mid-update comes back with a stage
            recorded and nothing running.

    RecoveryStatus:
      type: object
      additionalProperties: false
      required: [exists]
      description: |
        What can be said about a recovery code without revealing it. There is deliberately
        no field that could carry the code: it is stored as an argon2id hash, and a code
        the server can produce twice is a code an attacker who reads the database can use.
      properties:
        exists:
          type: boolean
          description: |
            `false` means this account has no way back in from a browser. The dashboard
            treats that as a warning rather than a neutral fact.
        issued_at:
          type: string
          format: date-time
          description: When the current code was created, so a user can tell whether the
            paper they are holding is the current one.
        last_used_at:
          type: string
          format: date-time
          description: |
            When a code was last used to recover this account. Carried forward when a code
            is replaced: the interesting fact is that a reset happened at all, and somebody
            who did not perform it needs to see it.

    RecoveredSession:
      type: object
      additionalProperties: false
      required: [user, expires_at, recovery_code]
      properties:
        user:
          type: object
          required: [id, username, permissions]
          properties:
            id:
              type: string
            username:
              type: string
            permissions:
              type: array
              items:
                type: string
            created_at:
              type: string
              format: date-time
        expires_at:
          type: string
          format: date-time
        recovery_code:
          type: string
          description: |
            The replacement, returned once and never retrievable again. Five groups of five
            characters from an alphabet with no `I`, `L`, `O` or `U`.
          example: 7K2M9-QRVWX-3TZ4P-HNBCD-8FGJ5

    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          examples: ["0.1.0-alpha.1"]
        hostd_reachable:
          type: boolean
        uptime_seconds:
          type: integer
          minimum: 0

    System:
      type: object
      additionalProperties: false
      required: [hostname, cpu, memory, storage]
      properties:
        hostname:
          type: string
        os:
          type: string
          examples: ["Ubuntu 24.04.1 LTS"]
        kernel:
          type: string
        uptime_seconds:
          type: integer
          minimum: 0
        cpu:
          type: object
          additionalProperties: false
          required: [model, cores, usage_percent]
          properties:
            model:
              type: string
            cores:
              type: integer
              minimum: 1
            threads:
              type: integer
              minimum: 1
            usage_percent:
              type: number
              minimum: 0
              maximum: 100
            temperature_celsius:
              type: [number, "null"]
              description: Null where the hardware does not report it.
        memory:
          type: object
          additionalProperties: false
          required: [total_bytes, available_bytes]
          properties:
            total_bytes:
              type: integer
              minimum: 0
            available_bytes:
              type: integer
              minimum: 0
        storage:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [mount_point, total_bytes, available_bytes]
            properties:
              mount_point:
                type: string
              filesystem:
                type: string
              total_bytes:
                type: integer
                minimum: 0
              available_bytes:
                type: integer
                minimum: 0
              removable:
                type: boolean
        power:
          type: object
          additionalProperties: false
          properties:
            on_battery:
              type: boolean
            battery_percent:
              type: [integer, "null"]
              minimum: 0
              maximum: 100
            lid_closed:
              type: [boolean, "null"]
        temperature:
          type: object
          additionalProperties: false
          description: |
            How hot the machine is. Homebase runs on old laptops in cupboards, and one
            cooking itself looks from the outside exactly like one that is broken.

            `celsius` is `null` when the machine has no thermal sensors — every VM, and some
            real hardware. **Never zero**, which would look wonderfully cool. Same rule as
            `battery_percent`: "cannot tell" and "fine" are different answers.
          properties:
            celsius:
              type: [integer, "null"]
              description: The hottest zone, not an average — one component at 95 °C is a
                problem an average would hide.
            sensor:
              type: string
              description: |
                Which zone the reading came from, in the kernel's words. On a machine with
                several it is what says whether it is the processor or the case.
            state:
              type: string
              enum: [ok, warm, hot]
              description: |
                Thresholds are deliberately high — processors are designed to run at 80 °C,
                and warning at 60 would teach people to ignore the warning.
            message:
              type: string
              description: |
                Only set when something is worth telling somebody. A machine at an ordinary
                temperature says nothing: an indicator that is always lit is one people stop
                seeing.
        fan:
          type: object
          additionalProperties: false
          description: |
            What the cooling is doing, reported beside the temperature and only meaningful
            with it. Loud and cool is a fan fault; loud and hot is a heatsink full of dust.
            From across a room those are the same sound and they have completely different
            fixes.

            Homebase reports the fan and does not drive it. On the first real laptop, full
            load reached 89 °C with the fan still climbing, past the 84 °C the processor
            throttles at — a manual fan setting on a machine like that is a way to cook a
            computer that is already struggling.
          properties:
            rpm:
              type: [integer, "null"]
              description: |
                Measured speed. `null` where there is no sensor — every VM — and also on
                hardware whose driver refuses to report a speed while the fan is under
                manual control, which is its own answer. **Never zero**, which would read
                as a seized fan rather than an absent sensor.
            percent:
              type: [integer, "null"]
              minimum: 0
              maximum: 100
              description: |
                How hard it is being driven. Reported alongside `rpm` because they answer
                different questions: rpm is how loud it is, percent is how much is left.
            label:
              type: string
              description: The kernel's name for it, such as `cpu_fan`.
            controlled:
              type: string
              enum: [firmware, manual, full]
              description: |
                Who decides the speed. `firmware` is the machine's own controller running
                its curve, which is the normal and best state. `manual` means something has
                overridden it. `full` is hwmon's "no control at all".
            message:
              type: string

    JobState:
      type: string
      description: |
        `rollback_failed` is terminal and the worst outcome: the operation failed and the
        attempt to undo it also failed. It always produces a user-visible alert with
        specific recovery instructions, and is never retried automatically — an automatic
        retry against an unknown state is how a bad situation becomes an unrecoverable one.
      enum:
        - queued
        - running
        - cancelling
        - cancelled
        - succeeded
        - failed
        - rolling_back
        - rolled_back
        - rollback_failed

    Job:
      type: object
      additionalProperties: false
      required: [job_id, state, operation, created_at]
      properties:
        job_id:
          type: string
          pattern: "^job_[0-9A-HJKMNP-TV-Z]{26}$"
        state:
          $ref: "#/components/schemas/JobState"
        operation:
          type: string
          examples: ["system.reboot", "apps.install"]
        stage:
          type: [string, "null"]
          examples: ["downloading_image"]
        progress:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: Null where progress is not knowable; report `stage` alone.
        message:
          type: [string, "null"]
          description: |
            Written for the person reading it, not for the developer who wrote it. This is
            a requirement rather than a nicety — it is the difference between a server its
            owner can reason about and one they must ask somebody about.
          examples: ["Downloading Jellyfin (1.2 GB of 1.8 GB)"]
        cancellable:
          type: boolean
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, "null"]
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorDetail"
            - type: "null"

    EventSeverity:
      type: string
      enum: [info, warning, error, critical]

    Application:
      type: object
      additionalProperties: false
      required: [id, name, state, image, data_path]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,38}[a-z0-9]$"
        name:
          type: string
          description: Display name, as the application calls itself.
        summary:
          type: string
          description: One sentence, for someone deciding whether they want this.
        state:
          $ref: "#/components/schemas/ApplicationState"
        installed:
          type: [boolean, "null"]
          description: |
            Null where `state` is `unknown`. `false` is a claim that the application is not
            there, which is not something anybody knows when the runtime did not answer.
        health:
          type: [string, "null"]
          description: |
            The application's own health result, or null where it declares no check or has not
            been checked yet. **Null is not "unhealthy"** — conflating the two reports a
            starting application as broken.
          examples: ["healthy", "starting", "unhealthy"]
        image:
          type: string
        version:
          type: string
        internal_port:
          type: integer
        started_at:
          type: [string, "null"]
          format: date-time
        exit_code:
          type: [integer, "null"]
          description: Present when the application is not running, so a failure has a reason.
        data_path:
          type: string
          description: |
            Where this application's data lives, so a user can be told what uninstalling will
            leave behind rather than having to trust that something was kept.

    ApplicationState:
      type: string
      enum: [not_installed, stopped, running, failed, unknown]
      description: |
        `failed` means the container exited on its own, which is different from `stopped` —
        somebody stopped that one deliberately.

        `unknown` means the container runtime could not be asked. It is deliberately not
        folded into `not_installed`: the two look identical in an interface and are entirely
        different facts, and one of them means a user's application is running fine while
        Homebase cannot see it. Reporting "not installed" there invites somebody to install
        it again on top of a working one.

    AppConfirmation:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: string
          description: |
            The application's id. The name rather than a boolean, for the same reason the
            reboot confirmation is the hostname: a `true` a client can send by default is not a
            confirmation, and one that names its target cannot be replayed against a different
            application.

    Disk:
      type: object
      additionalProperties: false
      required: [device, path, size_bytes, removable, system, volumes]
      properties:
        device:
          type: string
          description: |
            The kernel's current name for it. **Never store this.** It is assigned in
            discovery order, so a disk unplugged as `sda` can come back as `sdb`.
          examples: ["sdb"]
        path:
          type: string
          examples: ["/dev/sdb"]
        model:
          type: string
        vendor:
          type: string
        size_bytes:
          type: integer
        removable:
          type: boolean
        transport:
          type: string
          enum: [usb, sata, nvme, virtio, sd-card, ""]
          description: How it is attached. "the USB one" is how people identify a disk.
        system:
          type: boolean
          description: |
            This disk holds the running system. Homebase will not erase it, whatever is asked
            and however it is confirmed.
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/Volume"

    Volume:
      type: object
      additionalProperties: false
      required: [device, path, size_bytes, unreadable, read_only]
      properties:
        device:
          type: string
        path:
          type: string
        uuid:
          type: string
          description: |
            The filesystem's identity, and the only thing Homebase stores to find a disk
            again. Absent means this volume **cannot be assigned to an application**.
        label:
          type: string
        filesystem:
          type: string
          description: Empty means it was read and nothing recognisable was found.
          examples: ["ext4", "vfat", "ntfs", "exfat", "btrfs", "xfs", "crypto_LUKS"]
        unreadable:
          type: boolean
          description: |
            Homebase could not read this volume. **Not the same as an empty `filesystem`**,
            which means it was read and found blank. Conflating the two would let a disk
            nobody can see the contents of be described as empty, and then offered for
            erasure.
        size_bytes:
          type: integer
        mount_point:
          type: string
        read_only:
          type: boolean

    StorageLocation:
      type: object
      additionalProperties: false
      required: [id, name, uuid, mount_point, connected, mounted, read_only, added_at]
      properties:
        id:
          type: string
        name:
          type: string
        uuid:
          type: string
        filesystem:
          type: string
        label:
          type: string
        added_at:
          type: string
          format: date-time
        mount_point:
          type: string
        connected:
          type: boolean
          description: The disk is plugged in.
        mounted:
          type: boolean
          description: |
            And usable. Separate from `connected` because a disk that is present but failed to
            mount is a different problem, with a different remedy.
        read_only:
          type: boolean
        total_bytes:
          type: integer
        available_bytes:
          type: integer
          description: |
            Free space excluding blocks reserved for root, which a user cannot use. On a
            default ext4 that reserve is 5 % — 200 GB on a 4 TB disk.
        device:
          type: string
          description: Where it currently appears, for diagnostics. Never stored.

    ApplicationStorage:
      type: object
      additionalProperties: false
      required: [id, name, storage, ready]
      properties:
        id:
          type: string
        name:
          type: string
        ready:
          type: boolean
          description: |
            Every location this application needs is available. When false the application
            cannot start, and will refuse rather than run without its files.
        storage:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationStorageSlot"

    ApplicationStorageSlot:
      type: object
      additionalProperties: false
      required: [id, type, mount_path, read_only, ready]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [private, user-selected]
          description: |
            `private` is placed by Homebase under the application's own directory.
            `user-selected` needs a disk chosen by the user before the application can run.
        description:
          type: string
          description: Shown to the user when they are asked to choose a disk for this.
        mount_path:
          type: string
          description: Where it appears inside the application.
        read_only:
          type: boolean
        location:
          type: string
          description: The managed location assigned to this slot. Empty means none chosen.
        location_name:
          type: string
        ready:
          type: boolean
        path:
          type: string
          description: Where the data actually lives, when that is resolvable.

    NamedConfirmation:
      type: object
      additionalProperties: false
      required: [confirm]
      properties:
        confirm:
          type: string
          description: |
            The id of the thing being acted on. The name rather than a boolean, for the same
            reason everywhere else in Homebase: a `true` a client can send by default is not a
            confirmation, and one that names its target cannot be replayed against a different
            disk.

    Diagnostics:
      type: object
      additionalProperties: false
      required: [path, created_at, includes, excludes, message]
      properties:
        path:
          type: string
          description: Where the file is on the server. Download it rather than reading it.
        bytes:
          type: integer
        created_at:
          type: string
          format: date-time
        includes:
          type: array
          items:
            type: string
          description: What is in it, in words.
        excludes:
          type: array
          items:
            type: string
          description: |
            What is deliberately not in it. The list somebody checks before sending the file
            to a stranger.
        message:
          type: string

    RepairResult:
      type: object
      additionalProperties: false
      required: [steps, changed, healthy, message]
      properties:
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [what]
            properties:
              what:
                type: string
                description: The check, in words somebody can read.
              done:
                type: string
                description: What was actually done. Absent when nothing needed doing.
              problem:
                type: string
                description: Why the step could not be completed.
        changed:
          type: integer
          description: |
            How many steps had something to do. Zero means whatever is wrong is not one of
            the things repair knows how to fix, which is worth saying plainly.
        healthy:
          type: boolean
          description: Whether every step completed without a problem.
        message:
          type: string

    FactoryResetResult:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        removed:
          type: array
          items:
            type: string
        kept:
          type: array
          items:
            type: string
        message:
          type: string

    BackupSchedule:
      type: object
      additionalProperties: false
      required: [every, description, enabled]
      properties:
        every:
          type: string
          enum: [daily, weekly, off]
        location:
          type: string
          description: Where scheduled backups are written. Empty when nothing is scheduled.
        description:
          type: string
          description: The schedule in words, for a screen — not a calendar expression.
        enabled:
          type: boolean
          description: |
            Whether systemd will actually run it. Read from systemd, not inferred from the
            configuration file: a schedule recorded and not enabled is the failure worth
            seeing.
        next_run:
          type: string
          format: date-time
          description: |
            When systemd says it will next fire. systemd's own answer rather than one computed
            here, because it accounts for the randomised delay, for a missed run being caught
            up, and for the machine's timezone.
        last_result:
          type: string
          enum: [ok, failed]
          description: How the last scheduled run ended. Absent if it has never run.

    BackupSummary:
      type: object
      additionalProperties: false
      required: [id, location, complete]
      properties:
        id:
          type: string
        location:
          type: string
        created_at:
          type: string
          format: date-time
        hostname:
          type: string
          description: The machine that wrote it, so three folders on a disk can be told apart.
        version:
          type: string
        kind:
          type: string
          enum: [configuration, full]
          description: |
            `configuration` is settings only and takes seconds. `full` includes the files on
            your storage disks.
        files:
          type: integer
        total_bytes:
          type: integer
        applications:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
          description: |
            What was deliberately left out, in words — so somebody reading this is not misled
            about what they have.
        complete:
          type: boolean
          description: |
            False for a backup with no readable manifest: it was interrupted. Listed rather
            than hidden, because a folder that looks like a backup and is not is exactly what
            nobody must rely on.
        problem:
          type: string

    RestorePreview:
      type: object
      additionalProperties: false
      required: [id, location, files_to_write, would_overwrite, verified, message]
      properties:
        id:
          type: string
        location:
          type: string
        created_at:
          type: string
          format: date-time
        hostname:
          type: string
        kind:
          type: string
        applications:
          type: array
          items:
            type: string
        unavailable_applications:
          type: array
          items:
            type: string
          description: |
            In the backup, but not in this server's catalogue. Their files are restored, but
            they cannot be installed again — data with nothing to read it.
        applications_to_install:
          type: array
          items:
            type: string
        files_to_write:
          type: integer
        bytes_to_write:
          type: integer
        would_overwrite:
          type: integer
          description: |
            How many files on this server would be replaced. The number somebody actually
            needs before agreeing. Everything else is added, and nothing is deleted.
        verified:
          type: boolean
          description: |
            Whether the backup's checksums still match, checked before it is offered rather
            than after it has been agreed to. Restoring from an unverified backup is a guess.
        integrity_issues:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
        message:
          type: string
          description: The whole of the above, in one paragraph a person can read.

    EventList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total:
          type: integer

    Event:
      type: object
      additionalProperties: false
      required: [event_id, type, severity, occurred_at]
      properties:
        event_id:
          type: string
        type:
          type: string
          description: Machine-readable, `domain.event`.
          examples: ["application_unhealthy", "backup_completed"]
        severity:
          $ref: "#/components/schemas/EventSeverity"
        subject:
          type: [string, "null"]
          description: What the event is about.
          examples: ["adguard"]
        reason:
          type: [string, "null"]
          description: Machine-readable cause.
          examples: ["dns_probe_failed"]
        recoverable:
          type: [boolean, "null"]
        message:
          type: [string, "null"]
          description: Human-readable rendering. Never the only source of information.
        occurred_at:
          type: string
          format: date-time

    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          pattern: "^[a-z]+(\\.[a-z_]+)+$"
          description: |
            Stable and machine-readable, `domain.reason`. Never changes meaning once
            shipped. This is the contract; `message` is not.
          examples: ["storage.disk_not_found"]
        message:
          type: string
          description: One sentence, for someone who does not know what a mount point is.
          examples: ["The backup disk is not connected."]
        detail:
          type: [string, "null"]
          description: Specifics for diagnosis. May name paths and devices. Never secrets.
        recoverable:
          type: [boolean, "null"]
        recovery:
          type: [string, "null"]
          description: What the user can actually do.
          examples: ["Reconnect the backup disk and try again."]
        request_id:
          type: [string, "null"]
        documentation_url:
          type: [string, "null"]
          format: uri

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
